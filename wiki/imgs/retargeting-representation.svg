<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="表示与坐标：相同的动作，为什么会变成不同的数字？">
<defs><linearGradient id="header"><stop stop-color="#063c76"/><stop offset="1" stop-color="#087eae"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#397bad" stroke-width="1.6"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .label{font-weight:700}</style>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#f3f7fc" stroke="none" stroke-width="2"/>
<rect x="16" y="16" width="1568" height="110" rx="15" fill="url(#header)" stroke="none" stroke-width="2"/>
<text x="42" y="64" font-size="34" fill="#fff" font-weight="700" text-anchor="start">表示与坐标：相同的动作，为什么会变成不同的数字？</text>
<text x="44" y="103" font-size="21" fill="#d8efff" font-weight="400" text-anchor="start">四件事分别检查：骨架层级、世界坐标、身体局部框架、形态比例。</text>
<rect x="16" y="146" width="766" height="294" rx="12" fill="#fff" stroke="#087fca" stroke-width="2"/>
<rect x="17" y="147" width="764" height="52" rx="10" fill="#087fca" stroke="none" stroke-width="2"/>
<circle cx="44" cy="173" r="18" fill="white"/>
<text x="44" y="181" font-size="23" fill="#087fca" font-weight="700" text-anchor="middle">1</text>
<text x="73" y="181" font-size="25" fill="white" font-weight="700" text-anchor="start">局部骨架 → 世界位姿</text>
<rect x="36" y="221" width="328" height="135" rx="12" fill="#eef7ff" stroke="#087fca" stroke-width="2"/>
<text x="54" y="255" font-size="25" fill="#087fca" font-weight="700" text-anchor="start">相对父骨骼的变换</text>
<text x="54" y="293" font-size="22" fill="#103858" font-weight="400" text-anchor="start">髋 → 大腿 → 小腿 → 脚</text>
<text x="54" y="327" font-size="22" fill="#103858" font-weight="400" text-anchor="start">不能把局部量直接当世界坐标</text>
<rect x="426" y="221" width="336" height="135" rx="12" fill="#eef7ff" stroke="#087fca" stroke-width="2"/>
<text x="444" y="255" font-size="25" fill="#087fca" font-weight="700" text-anchor="start">沿骨架逐级相乘</text>
<text x="444" y="293" font-size="22" fill="#103858" font-weight="400" text-anchor="start">Tᵂᵢ = Tᵂparent · Tparentᵢ</text>
<text x="444" y="327" font-size="22" fill="#103858" font-weight="400" text-anchor="start">得到每个部位的世界位置 / 朝向</text>
<path d="M371 288 L417 288" stroke="#397bad" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="40" y="408" font-size="23" fill="#4f6980" font-weight="400" text-anchor="start">BVH 通道与骨段偏移必须按文件约定解释。</text>
<rect x="798" y="146" width="786" height="294" rx="12" fill="#fff" stroke="#07569b" stroke-width="2"/>
<rect x="799" y="147" width="784" height="52" rx="10" fill="#07569b" stroke="none" stroke-width="2"/>
<circle cx="826" cy="173" r="18" fill="white"/>
<text x="826" y="181" font-size="23" fill="#07569b" font-weight="700" text-anchor="middle">2</text>
<text x="855" y="181" font-size="25" fill="white" font-weight="700" text-anchor="start">统一世界坐标：整体表达改变</text>
<path d="M856 355 L856 245" stroke="#397bad" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M856 355 L973 355" stroke="#397bad" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="837" y="236" font-size="24" fill="#07569b" font-weight="700" text-anchor="start">Z</text>
<text x="980" y="361" font-size="24" fill="#07569b" font-weight="700" text-anchor="start">X</text>
<rect x="1020" y="221" width="544" height="135" rx="12" fill="#eef7ff" stroke="#07569b" stroke-width="2"/>
<text x="1038" y="255" font-size="25" fill="#07569b" font-weight="700" text-anchor="start">世界变换左乘：Tnew = C · Told</text>
<text x="1038" y="293" font-size="22" fill="#103858" font-weight="400" text-anchor="start">例如 Y-up → Z-up；不改变骨长比例</text>
<text x="1038" y="327" font-size="22" fill="#103858" font-weight="400" text-anchor="start">位置单位先统一为米，不包含在刚体 C 中</text>
<text x="822" y="408" font-size="23" fill="#4f6980" font-weight="400" text-anchor="start">现象：整个人倒下或运动方向错误 → 先查世界坐标。</text>
<rect x="16" y="461" width="766" height="320" rx="12" fill="#fff" stroke="#7542c8" stroke-width="2"/>
<rect x="17" y="462" width="764" height="52" rx="10" fill="#7542c8" stroke="none" stroke-width="2"/>
<circle cx="44" cy="488" r="18" fill="white"/>
<text x="44" y="496" font-size="23" fill="#7542c8" font-weight="700" text-anchor="middle">3</text>
<text x="73" y="496" font-size="25" fill="white" font-weight="700" text-anchor="start">身体框架偏置：局部轴对齐</text>
<rect x="36" y="536" width="726" height="118" rx="12" fill="#f5efff" stroke="#7542c8" stroke-width="2"/>
<text x="54" y="570" font-size="25" fill="#7542c8" font-weight="700" text-anchor="start">框架变换右乘：Ttarget = Tbody · Toffset</text>
<text x="54" y="608" font-size="22" fill="#103858" font-weight="400" text-anchor="start">人体脚局部轴与机器人脚局部轴未必一致</text>
<text x="54" y="642" font-size="22" fill="#103858" font-weight="400" text-anchor="start">朝向对齐与位置偏置需要写清所在坐标系</text>
<text x="42" y="701" font-size="23" fill="#103858" font-weight="400" text-anchor="start">现象：脚位置对，但朝向扭了 90° → 查局部轴偏置</text>
<text x="42" y="741" font-size="23" fill="#103858" font-weight="400" text-anchor="start">对应“有几何含义的框架”，而不是只对应关节名</text>
<rect x="798" y="461" width="786" height="320" rx="12" fill="#fff" stroke="#099773" stroke-width="2"/>
<rect x="799" y="462" width="784" height="52" rx="10" fill="#099773" stroke="none" stroke-width="2"/>
<circle cx="826" cy="488" r="18" fill="white"/>
<text x="826" y="496" font-size="23" fill="#099773" font-weight="700" text-anchor="middle">4</text>
<text x="855" y="496" font-size="25" fill="white" font-weight="700" text-anchor="start">形态缩放：改变目标的身体比例</text>
<rect x="818" y="536" width="746" height="118" rx="12" fill="#edf9f4" stroke="#099773" stroke-width="2"/>
<text x="836" y="570" font-size="25" fill="#099773" font-weight="700" text-anchor="start">根轨迹与局部身体分别处理</text>
<text x="836" y="608" font-size="22" fill="#103858" font-weight="400" text-anchor="start">根：走多远？    局部：手脚离身体多远？</text>
<text x="836" y="642" font-size="22" fill="#103858" font-weight="400" text-anchor="start">腿长比例与上半身触达比例可使用不同缩放</text>
<text x="824" y="701" font-size="23" fill="#103858" font-weight="400" text-anchor="start">现象：方向正确，但手够不到 / 脚高度不对 → 查缩放</text>
<text x="824" y="741" font-size="23" fill="#103858" font-weight="400" text-anchor="start">缩放不是 SE(3) 刚体变换；不能当作标定偏置</text>
<rect x="16" y="806" width="1568" height="78" rx="12" fill="url(#header)" stroke="none" stroke-width="2"/>
<text x="40" y="838" font-size="25" fill="#fff" font-weight="700" text-anchor="start">先确认数值的含义，再优化误差；权重无法修复错误的坐标约定。</text>
<text x="40" y="867" font-size="18" fill="#d8efff" font-weight="400" text-anchor="start">原创原理示意 · 具体约定与适用条件见正文 · cxwiki / 2026-11-05</text>
</svg>