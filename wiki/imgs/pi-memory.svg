<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="MEM：短时视频 + 长时语言记忆"><defs><linearGradient id="head"><stop stop-color="#063c76"/><stop offset="1" stop-color="#087eae"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#397bad" stroke-width="1.5"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="900" fill="#f3f7fc"/><rect x="16" y="16" width="1568" height="112" rx="15" fill="url(#head)"/><text x="45" y="66" font-size="35" fill="white" font-weight="700">MEM：短时视频 + 长时语言记忆</text><text x="46" y="103" font-size="20" fill="#d8efff">密集视觉保留局部细节，语言摘要跟踪跨分钟任务进度。</text><rect x="35" y="165" width="455" height="560" rx="14" fill="white" stroke="#087fca" stroke-width="2"/><rect x="36" y="166" width="453" height="54" rx="13" fill="#087fca"/><circle cx="65" cy="193" r="18" fill="white"/><text x="65" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#087fca">1</text><text x="95" y="201" font-size="25" fill="white" font-weight="700">当前与近期观察</text><text x="55" y="261" font-size="22" fill="#103858">最近 K 秒图像、状态</text><text x="55" y="300" font-size="22" fill="#103858">视频编码器交替空间/时间注意力</text><text x="55" y="339" font-size="22" fill="#103858">丢弃历史 token，控制主干输入量</text><text x="55" y="378" font-size="22" fill="#103858">处理遮挡、重抓与动作时序</text><text x="55" y="417" font-size="22" fill="#103858"></text><rect x="65" y="510" width="395" height="82" rx="10" fill="#eef7ff" stroke="#087fca" stroke-width="2"/><text x="80" y="542" font-size="23" fill="#087fca" font-weight="700">短时：精确但窗口有限</text><rect x="570" y="165" width="455" height="560" rx="14" fill="white" stroke="#7542c8" stroke-width="2"/><rect x="571" y="166" width="453" height="54" rx="13" fill="#7542c8"/><circle cx="600" cy="193" r="18" fill="white"/><text x="600" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#7542c8">2</text><text x="630" y="201" font-size="25" fill="white" font-weight="700">高层语言记忆</text><text x="590" y="261" font-size="22" fill="#103858">mₜ：已完成事件摘要</text><text x="590" y="300" font-size="22" fill="#103858">π_HL(子任务,mₜ₊₁ | 当前,mₜ)</text><text x="590" y="339" font-size="22" fill="#103858">失败与进度写入自然语言</text><text x="590" y="378" font-size="22" fill="#103858">压缩无关细节，保留可决策信息</text><text x="590" y="417" font-size="22" fill="#103858"></text><rect x="600" y="510" width="395" height="82" rx="10" fill="#eef7ff" stroke="#7542c8" stroke-width="2"/><text x="615" y="542" font-size="23" fill="#7542c8" font-weight="700">长时：抽象且可读</text><rect x="1115" y="165" width="450" height="560" rx="14" fill="white" stroke="#099773" stroke-width="2"/><rect x="1116" y="166" width="448" height="54" rx="13" fill="#099773"/><circle cx="1145" cy="193" r="18" fill="white"/><text x="1145" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#099773">3</text><text x="1175" y="201" font-size="25" fill="white" font-weight="700">低层执行</text><text x="1135" y="261" font-size="22" fill="#103858">π_LL(A | 近期视频,子任务)</text><text x="1135" y="300" font-size="22" fill="#103858">高层更新不必每个控制周期发生</text><text x="1135" y="339" font-size="22" fill="#103858">两条时间尺度共同闭环</text><text x="1135" y="378" font-size="22" fill="#103858">作者报告最长约 15 分钟任务</text><text x="1135" y="417" font-size="22" fill="#103858"></text><rect x="1145" y="510" width="390" height="82" rx="10" fill="#eef7ff" stroke="#099773" stroke-width="2"/><text x="1160" y="542" font-size="23" fill="#099773" font-weight="700">MEM 集成到 π₀.₆</text><rect x="16" y="807" width="1568" height="77" rx="12" fill="url(#head)"/><text x="42" y="843" font-size="24" fill="white" font-weight="700">MEM不是把完整历史塞进上下文，而是按时间尺度改变表示</text><text x="42" y="871" font-size="17" fill="#d8efff">原创原理示意；数字、坐标和适用条件以正文来源为准。</text></svg>