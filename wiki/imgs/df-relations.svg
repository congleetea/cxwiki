<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="⑤ 先分清：路径、预测量、求解器"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="620" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">⑤ 先分清：路径、预测量、求解器</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">看见相同的迭代外观，不代表训练目标相同；换采样器也不必重训。</text><rect x="40" y="145" width="350" height="310" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="40" y="145" width="5" height="310" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="58" y="179" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">一：概率路径</text><text x="58" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">中间分布如何变化？</text><text x="58" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">扩散加噪日程</text><text x="58" y="297" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">线性插值路径</text><text x="58" y="337" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">其他高斯条件路径</text><rect x="425" y="145" width="350" height="310" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="425" y="145" width="5" height="310" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="443" y="179" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">二：网络预测量</text><text x="443" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">每一步网络输出什么？</text><text x="443" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">噪声 / 干净样本 / score</text><text x="443" y="297" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">流匹配速度</text><text x="443" y="337" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">转换依赖路径与缩放</text><rect x="810" y="145" width="350" height="310" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="810" y="145" width="5" height="310" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="828" y="179" font-size="24" fill="#278977" text-anchor="start" font-weight="600">三：生成求解器</text><text x="828" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">怎样走到最终样本？</text><text x="828" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">随机反向扩散</text><text x="828" y="297" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">确定性 ODE / DDIM</text><text x="828" y="337" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">步长、阶数、调用次数</text><text x="600" y="520" font-size="25" fill="#18364d" text-anchor="middle" font-weight="400">扩散可以有确定性采样；流匹配可以使用扩散式概率路径。</text><text x="30" y="596" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创分类图；这三个维度应分开比较，不能用“随机 / 确定”直接区分两个训练家族。</text></svg>