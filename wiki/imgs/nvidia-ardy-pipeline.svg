<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#38617b"/></marker></defs><rect width="1200" height="460" fill="#f5f8fc"/><style>text{font-family: sans-serif;fill:#14344c;font-size:23px}.label{font-size:20px}.box{fill:white;stroke:#6196bb;stroke-width:2}.arrow{stroke:#38617b;stroke-width:3;marker-end:url(#arrow)}</style><text x="32" y="44" font-size="30">ARDY：表示 → 每步两阶段去噪 → 解码与滚动播放</text><rect class="box" x="30" y="95" width="235" height="215" rx="12"/><text x="50" y="134">① 混合表示</text><text class="label" x="50" y="180">显式全局根轨迹</text><text class="label" x="50" y="218">＋潜在身体 token</text><text class="label" x="50" y="265">文字 / 历史 / 目标</text><line class="arrow" x1="270" y1="202" x2="317" y2="202"/><rect class="box" x="325" y="95" width="245" height="215" rx="12"/><text x="345" y="134">② 根 Transformer</text><text class="label" x="345" y="190">预测干净根运动</text><text class="label" x="345" y="235">根目标覆写输入</text><line class="arrow" x1="575" y1="202" x2="622" y2="202"/><rect class="box" x="630" y="95" width="245" height="215" rx="12"/><text x="650" y="134">③ 身体 Transformer</text><text class="label" x="650" y="190">读取 detach 根预测</text><text class="label" x="650" y="235">预测干净身体 token</text><line class="arrow" x1="880" y1="202" x2="927" y2="202"/><rect class="box" x="935" y="95" width="235" height="215" rx="12"/><text x="955" y="134">④ 解码与播放</text><text class="label" x="955" y="190">人体骨架运动</text><text class="label" x="955" y="235">新输入触发重规划</text><path d="M750 315V355H445V315" fill="none" class="arrow"/><text class="label" x="440" y="395">中间步：重新加噪，继续下一去噪步</text><text class="label" x="32" y="441">原创示意，依据论文 §3–4。末步后才解码输出；人体运动参考不等于机器人动力学控制。</text></svg>