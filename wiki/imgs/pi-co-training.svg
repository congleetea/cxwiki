<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="π₀.₅：异构数据共同教“做什么”和“怎么做”"><defs><linearGradient id="head"><stop stop-color="#063c76"/><stop offset="1" stop-color="#087eae"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#397bad" stroke-width="1.5"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="900" fill="#f3f7fc"/><rect x="16" y="16" width="1568" height="112" rx="15" fill="url(#head)"/><text x="45" y="66" font-size="35" fill="white" font-weight="700">π₀.₅：异构数据共同教“做什么”和“怎么做”</text><text x="46" y="103" font-size="20" fill="#d8efff">无动作数据贡献语义与位置监督；机器人数据贡献物理交互。</text><rect x="35" y="165" width="430" height="560" rx="14" fill="white" stroke="#087fca" stroke-width="2"/><rect x="36" y="166" width="428" height="54" rx="13" fill="#087fca"/><circle cx="65" cy="193" r="18" fill="white"/><text x="65" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#087fca">1</text><text x="95" y="201" font-size="25" fill="white" font-weight="700">数据混合</text><text x="55" y="261" font-size="22" fill="#103858">机器人动作：多本体、多环境</text><text x="55" y="300" font-size="22" fill="#103858">子任务文字：pick up…</text><text x="55" y="339" font-size="22" fill="#103858">Web：描述、VQA、定位</text><text x="55" y="378" font-size="22" fill="#103858">人类视频属于后续迁移研究</text><text x="55" y="417" font-size="22" fill="#103858"></text><rect x="65" y="510" width="370" height="82" rx="10" fill="#eef7ff" stroke="#087fca" stroke-width="2"/><text x="80" y="542" font-size="23" fill="#087fca" font-weight="700">标签不同，不能互造监督</text><rect x="585" y="165" width="430" height="560" rx="14" fill="white" stroke="#7542c8" stroke-width="2"/><rect x="586" y="166" width="428" height="54" rx="13" fill="#7542c8"/><circle cx="615" cy="193" r="18" fill="white"/><text x="615" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#7542c8">2</text><text x="645" y="201" font-size="25" fill="white" font-weight="700">预训练阶段</text><text x="605" y="261" font-size="22" fill="#103858">FAST动作 token + next-token</text><text x="605" y="300" font-size="22" fill="#103858">语言 / 子任务 / 视觉任务</text><text x="605" y="339" font-size="22" fill="#103858">α=0：不训练流匹配损失</text><text x="605" y="378" font-size="22" fill="#103858">得到广泛视觉—动作表示</text><text x="605" y="417" font-size="22" fill="#103858"></text><rect x="615" y="510" width="370" height="82" rx="10" fill="#eef7ff" stroke="#7542c8" stroke-width="2"/><text x="630" y="542" font-size="23" fill="#7542c8" font-weight="700">先学表示与语义泛化</text><rect x="1135" y="165" width="430" height="560" rx="14" fill="white" stroke="#099773" stroke-width="2"/><rect x="1136" y="166" width="428" height="54" rx="13" fill="#099773"/><circle cx="1165" cy="193" r="18" fill="white"/><text x="1165" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#099773">3</text><text x="1195" y="201" font-size="25" fill="white" font-weight="700">后训练与执行</text><text x="1155" y="261" font-size="22" fill="#103858">加入连续动作专家</text><text x="1155" y="300" font-size="22" fill="#103858">L=L_token+αL_FM</text><text x="1155" y="339" font-size="22" fill="#103858">高层生成子任务文字</text><text x="1155" y="378" font-size="22" fill="#103858">低层生成连续动作块</text><text x="1155" y="417" font-size="22" fill="#103858"></text><rect x="1165" y="510" width="370" height="82" rx="10" fill="#eef7ff" stroke="#099773" stroke-width="2"/><text x="1180" y="542" font-size="23" fill="#099773" font-weight="700">新环境中闭环重观察</text><rect x="16" y="807" width="1568" height="77" rx="12" fill="url(#head)"/><text x="42" y="843" font-size="24" fill="white" font-weight="700">核心判断：泛化来自监督和场景的组合，不是“数据越杂越好”</text><text x="42" y="871" font-size="17" fill="#d8efff">原创原理示意；数字、坐标和适用条件以正文来源为准。</text></svg>