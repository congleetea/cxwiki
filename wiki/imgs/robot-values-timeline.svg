<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-label="机器人价值与奖励：按首次公开时间看问题怎样变化"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="940" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">机器人价值与奖励：按首次公开时间看问题怎样变化</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">时间表示公开顺序，不表示后一工作完全替代前一工作。</text><path d="M230 155L230 830" fill="none" stroke="#647f93" stroke-width="3"/><text x="35" y="190" font-size="23" fill="#2473a6" text-anchor="start" font-weight="400">2022-04</text><circle cx="230" cy="181" r="8" fill="#2473a6"/><rect x="265" y="155" width="895" height="70" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><text x="285" y="184" font-size="23" fill="#2473a6" text-anchor="start" font-weight="600">SayCan</text><text x="285" y="212" font-size="20" fill="#18364d" text-anchor="start" font-weight="400">技能可行性：语言说得通，还要机器人做得到</text><text x="35" y="276" font-size="23" fill="#8061bb" text-anchor="start" font-weight="400">2024-11</text><circle cx="230" cy="267" r="8" fill="#8061bb"/><rect x="265" y="241" width="895" height="70" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><text x="285" y="270" font-size="23" fill="#8061bb" text-anchor="start" font-weight="600">GVL</text><text x="285" y="298" font-size="20" fill="#18364d" text-anchor="start" font-weight="400">冻结 VLM：由视频内容生成任务进度</text><text x="35" y="362" font-size="23" fill="#278977" text-anchor="start" font-weight="400">2025-09</text><circle cx="230" cy="353" r="8" fill="#278977"/><rect x="265" y="327" width="895" height="70" rx="12" fill="white" stroke="#278977" stroke-width="2"/><text x="285" y="356" font-size="23" fill="#278977" text-anchor="start" font-weight="600">SARM</text><text x="285" y="384" font-size="20" fill="#18364d" text-anchor="start" font-weight="400">语义阶段：对齐快慢不同的长程示范</text><text x="35" y="448" font-size="23" fill="#cf7446" text-anchor="start" font-weight="400">2025-12</text><circle cx="230" cy="439" r="8" fill="#cf7446"/><rect x="265" y="413" width="895" height="70" rx="12" fill="white" stroke="#cf7446" stroke-width="2"/><text x="285" y="442" font-size="23" fill="#cf7446" text-anchor="start" font-weight="600">Robo-Dopamine</text><text x="285" y="470" font-size="20" fill="#18364d" text-anchor="start" font-weight="400">相对 hop：从进度到折扣一致的奖励塑造</text><text x="35" y="534" font-size="23" fill="#8061bb" text-anchor="start" font-weight="400">2026-02</text><circle cx="230" cy="525" r="8" fill="#8061bb"/><rect x="265" y="499" width="895" height="70" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><text x="285" y="528" font-size="23" fill="#8061bb" text-anchor="start" font-weight="600">TOPReward</text><text x="285" y="556" font-size="20" fill="#18364d" text-anchor="start" font-weight="400">概率读出：绕过直接生成数字的瓶颈</text><text x="35" y="620" font-size="23" fill="#278977" text-anchor="start" font-weight="400">2026-03</text><circle cx="230" cy="611" r="8" fill="#278977"/><rect x="265" y="585" width="895" height="70" rx="12" fill="white" stroke="#278977" stroke-width="2"/><text x="285" y="614" font-size="23" fill="#278977" text-anchor="start" font-weight="600">Robometer</text><text x="285" y="642" font-size="20" fill="#18364d" text-anchor="start" font-weight="400">轨迹比较：让失败和次优数据也参与监督</text><text x="35" y="706" font-size="23" fill="#cf7446" text-anchor="start" font-weight="400">2026-04</text><circle cx="230" cy="697" r="8" fill="#cf7446"/><rect x="265" y="671" width="895" height="70" rx="12" fill="white" stroke="#cf7446" stroke-width="2"/><text x="285" y="700" font-size="23" fill="#cf7446" text-anchor="start" font-weight="600">ARM</text><text x="285" y="728" font-size="20" fill="#18364d" text-anchor="start" font-weight="400">三态相对变化：保留退步、恢复与完成锚点</text><text x="35" y="792" font-size="23" fill="#2473a6" text-anchor="start" font-weight="400">2026-06</text><circle cx="230" cy="783" r="8" fill="#2473a6"/><rect x="265" y="757" width="895" height="70" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><text x="285" y="786" font-size="23" fill="#2473a6" text-anchor="start" font-weight="600">SARM2</text><text x="285" y="814" font-size="20" fill="#18364d" text-anchor="start" font-weight="400">共享动作基元：多任务评分接入改进循环</text><text x="30" y="916" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创时间线；日期依据 arXiv 首次提交记录，方法内容依据各概念文注明的版本核验。</text></svg>