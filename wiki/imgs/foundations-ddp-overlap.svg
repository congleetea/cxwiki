<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="DDP：梯度桶就绪后，让通信与反向计算重叠"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="460" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">DDP：梯度桶就绪后，让通信与反向计算重叠</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">一条时间线上的示意；实际桶顺序和重叠程度取决于运行时。</text><text x="35" y="185" font-size="23" fill="#2473a6" text-anchor="start" font-weight="400">反向计算</text><text x="35" y="300" font-size="23" fill="#278977" text-anchor="start" font-weight="400">梯度归约</text><rect x="205" y="135" width="220" height="85" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="205" y="135" width="5" height="85" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="223" y="169" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">梯度桶 1</text><rect x="295" y="255" width="220" height="85" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="295" y="255" width="5" height="85" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="313" y="289" font-size="24" fill="#278977" text-anchor="start" font-weight="600">AllReduce 1</text><path d="M385 225L385 250" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="450" y="135" width="220" height="85" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="450" y="135" width="5" height="85" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="468" y="169" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">梯度桶 2</text><rect x="540" y="255" width="220" height="85" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="540" y="255" width="5" height="85" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="558" y="289" font-size="24" fill="#278977" text-anchor="start" font-weight="600">AllReduce 2</text><path d="M630 225L630 250" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="135" width="220" height="85" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="695" y="135" width="5" height="85" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="713" y="169" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">梯度桶 3</text><rect x="785" y="255" width="220" height="85" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="785" y="255" width="5" height="85" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="803" y="289" font-size="24" fill="#278977" text-anchor="start" font-weight="600">AllReduce 3</text><path d="M875 225L875 250" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="436" font-size="19" fill="#607789" text-anchor="start" font-weight="400">不是等所有层反向完成才启动全部通信；但也不意味着通信一定能完全隐藏。</text></svg>