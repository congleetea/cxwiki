</svg><text x="360" y="130" font-size="22" fill="#18364d" text-anchor="start" font-weight="400">蓝：语言分数；绿：可行性</text><text x="710" y="440" font-size="24" fill="#8061bb" text-anchor="start" font-weight="400">选择乘积最大的“拿纸巾”</text><text x="30" y="536" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创评分对照；只在给定候选库内选技能，乘积不会自动产生新的机器人能力。</text></svg>