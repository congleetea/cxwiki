<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="再看一层：信息交流、特征加工与稳定通路"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="690" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">再看一层：信息交流、特征加工与稳定通路</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">展开编码器式 Post-LN Block；经典解码层还会在两者之间加入交叉注意力。</text><rect x="235" y="150" width="760" height="93" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="235" y="150" width="5" height="93" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="253" y="184" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">① Self-Attention：位置之间交流</text><text x="253" y="222" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">每个位置根据相关性，读取其他允许位置的内容</text><path d="M615 246L615 262" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="235" y="265" width="760" height="93" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="235" y="265" width="5" height="93" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="253" y="299" font-size="24" fill="#278977" text-anchor="start" font-weight="600">② Add &amp; Norm：相加并归一化</text><text x="253" y="337" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">合入子层前的输入，再调整每个位置的特征尺度</text><path d="M615 361L615 377" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="235" y="380" width="760" height="93" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="235" y="380" width="5" height="93" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="253" y="414" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">③ FFN：每个位置加工自己的特征</text><text x="253" y="452" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">同一组非线性网络作用于各位置；本子层不跨位置读取</text><path d="M615 476L615 492" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="235" y="495" width="760" height="93" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="235" y="495" width="5" height="93" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="253" y="529" font-size="24" fill="#278977" text-anchor="start" font-weight="600">④ Add &amp; Norm：再次保留旁路</text><text x="253" y="567" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">合入 FFN 前的表示，形成这一层的输出</text><path d="M615 110L615 147" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 128L155 128L155 310L230 310" fill="none" stroke="#278977" stroke-width="3" stroke-linejoin="round"/><path d="M215 310L232 310" fill="none" stroke="#278977" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 368L1070 368L1070 540L1000 540" fill="none" stroke="#278977" stroke-width="3" stroke-linejoin="round"/><path d="M1015 540L998 540" fill="none" stroke="#278977" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 590L615 625" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><text x="90" y="220" font-size="22" fill="#278977" text-anchor="start" font-weight="400">残差旁路</text><text x="1050" y="450" font-size="22" fill="#278977" text-anchor="start" font-weight="400">残差</text><text x="30" y="666" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创职责图；图中为经典 Post-LN 顺序。Pre-LN 的归一化放在子层前，细节见系列第三篇。</text></svg>