<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="弹性约束：始终有解，为什么不等于始终安全？">
<defs><linearGradient id="header"><stop stop-color="#063c76"/><stop offset="1" stop-color="#087eae"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#397bad" stroke-width="1.6"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .label{font-weight:700}</style>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#f3f7fc" stroke="none" stroke-width="2"/>
<rect x="16" y="16" width="1568" height="110" rx="15" fill="url(#header)" stroke="none" stroke-width="2"/>
<text x="42" y="64" font-size="34" fill="#fff" font-weight="700" text-anchor="start">弹性约束：始终有解，为什么不等于始终安全？</text>
<text x="44" y="103" font-size="21" fill="#d8efff" font-weight="400" text-anchor="start">一维速度示意；松弛让冲突时仍能给出折中，违反量需要被显式检查。</text>
<rect x="16" y="146" width="1568" height="276" rx="12" fill="#fff" stroke="#e06450" stroke-width="2"/>
<rect x="17" y="147" width="1566" height="52" rx="10" fill="#e06450" stroke="none" stroke-width="2"/>
<circle cx="44" cy="173" r="18" fill="white"/>
<text x="44" y="181" font-size="23" fill="#e06450" font-weight="700" text-anchor="middle">1</text>
<text x="73" y="181" font-size="25" fill="white" font-weight="700" text-anchor="start">两个冲突条件：v ≥ 0.6，同时 v ≤ 0.2</text>
<rect x="122" y="248" width="294" height="56" rx="12" fill="#edf9f4" stroke="none" stroke-width="2"/>
<rect x="984" y="248" width="432" height="56" rx="12" fill="#f3edff" stroke="none" stroke-width="2"/>
<path d="M118 327 L1447 327" stroke="#397bad" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M122 317 V338" stroke="#07569b" stroke-width="2"/>
<text x="122" y="371" font-size="24" fill="#07569b" font-weight="400" text-anchor="middle">0</text>
<path d="M416 317 V338" stroke="#07569b" stroke-width="2"/>
<text x="416" y="371" font-size="24" fill="#07569b" font-weight="400" text-anchor="middle">0.2</text>
<path d="M984 317 V338" stroke="#07569b" stroke-width="2"/>
<text x="984" y="371" font-size="24" fill="#07569b" font-weight="400" text-anchor="middle">0.6</text>
<path d="M1416 317 V338" stroke="#07569b" stroke-width="2"/>
<text x="1416" y="371" font-size="24" fill="#07569b" font-weight="400" text-anchor="middle">0.9</text>
<text x="150" y="283" font-size="24" fill="#099773" font-weight="700" text-anchor="start">满足 v ≤ 0.2</text>
<text x="1010" y="283" font-size="24" fill="#7542c8" font-weight="700" text-anchor="start">满足 v ≥ 0.6</text>
<text x="700" y="284" font-size="26" fill="#e06450" font-weight="700" text-anchor="middle">没有交集 → 硬约束无解</text>
<rect x="16" y="443" width="766" height="337" rx="12" fill="#fff" stroke="#7542c8" stroke-width="2"/>
<rect x="17" y="444" width="764" height="52" rx="10" fill="#7542c8" stroke="none" stroke-width="2"/>
<circle cx="44" cy="470" r="18" fill="white"/>
<text x="44" y="478" font-size="23" fill="#7542c8" font-weight="700" text-anchor="middle">2</text>
<text x="73" y="478" font-size="25" fill="white" font-weight="700" text-anchor="start">引入松弛：允许付出代价</text>
<rect x="36" y="518" width="726" height="118" rx="12" fill="#f5efff" stroke="#7542c8" stroke-width="2"/>
<text x="54" y="552" font-size="25" fill="#7542c8" font-weight="700" text-anchor="start">Gv ≤ h + s，s ≥ 0</text>
<text x="54" y="590" font-size="22" fill="#103858" font-weight="400" text-anchor="start">目标函数加上 ρᵀs：违反越多，支付越多</text>
<text x="54" y="624" font-size="22" fill="#103858" font-weight="400" text-anchor="start">每条不等式可设置不同罚系数</text>
<text x="42" y="686" font-size="23" fill="#103858" font-weight="400" text-anchor="start">求解器把松弛解析消去，减轻计算开销</text>
<text x="42" y="729" font-size="23" fill="#103858" font-weight="400" text-anchor="start">硬等式仍需相容；不是任意矛盾都能自动消失</text>
<rect x="798" y="443" width="786" height="337" rx="12" fill="#fff" stroke="#099773" stroke-width="2"/>
<rect x="799" y="444" width="784" height="52" rx="10" fill="#099773" stroke="none" stroke-width="2"/>
<circle cx="826" cy="470" r="18" fill="white"/>
<text x="826" y="478" font-size="23" fill="#099773" font-weight="700" text-anchor="middle">3</text>
<text x="855" y="478" font-size="25" fill="white" font-weight="700" text-anchor="start">真正要检查什么？</text>
<text x="824" y="544" font-size="25" fill="#103858" font-weight="400" text-anchor="start">① 违反了哪条约束？最大违反量是多少？</text>
<text x="824" y="601" font-size="25" fill="#103858" font-weight="400" text-anchor="start">② 罚系数是否足够？求解是否收敛？</text>
<text x="824" y="658" font-size="25" fill="#103858" font-weight="400" text-anchor="start">③ 球形近似、离散步与筛选漏掉了什么？</text>
<text x="824" y="715" font-size="25" fill="#103858" font-weight="400" text-anchor="start">④ 输出参考轨迹能否被物理控制器执行？</text>
<rect x="16" y="806" width="1568" height="78" rx="12" fill="url(#header)" stroke="none" stroke-width="2"/>
<text x="40" y="838" font-size="25" fill="#fff" font-weight="700" text-anchor="start">有解是计算层面的性质；安全与可执行性取决于约束是否满足及模型是否充分。</text>
<text x="40" y="867" font-size="18" fill="#d8efff" font-weight="400" text-anchor="start">原创原理示意 · 具体约定与适用条件见正文 · cxwiki / 2026-11-05</text>
</svg>