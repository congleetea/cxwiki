<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="FAST：把时间信号压缩成动作 token"><defs><linearGradient id="head"><stop stop-color="#063c76"/><stop offset="1" stop-color="#087eae"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#397bad" stroke-width="1.5"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="900" fill="#f3f7fc"/><rect x="16" y="16" width="1568" height="112" rx="15" fill="url(#head)"/><text x="45" y="66" font-size="35" fill="white" font-weight="700">FAST：把时间信号压缩成动作 token</text><text x="46" y="103" font-size="20" fill="#d8efff">DCT集中平滑轨迹的低频信息，BPE把量化后的整数序列合并。</text><rect x="35" y="165" width="350" height="560" rx="14" fill="white" stroke="#087fca" stroke-width="2"/><rect x="36" y="166" width="348" height="54" rx="13" fill="#087fca"/><circle cx="65" cy="193" r="18" fill="white"/><text x="65" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#087fca">1</text><text x="95" y="201" font-size="25" fill="white" font-weight="700">动作块</text><text x="55" y="261" font-size="22" fill="#103858">A∈Rᴴ×ᵈ</text><text x="55" y="300" font-size="22" fill="#103858">每列是一个动作通道</text><text x="55" y="339" font-size="22" fill="#103858">先用训练集分位数归一化</text><text x="55" y="378" font-size="22" fill="#103858"></text><rect x="60" y="390" width="300" height="82" rx="10" fill="#eef7ff" stroke="#087fca" stroke-width="2"/><text x="75" y="422" font-size="23" fill="#087fca" font-weight="700">[关节角 / 位移 / 夹爪]</text><rect x="425" y="165" width="350" height="560" rx="14" fill="white" stroke="#7542c8" stroke-width="2"/><rect x="426" y="166" width="348" height="54" rx="13" fill="#7542c8"/><circle cx="455" cy="193" r="18" fill="white"/><text x="455" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#7542c8">2</text><text x="485" y="201" font-size="25" fill="white" font-weight="700">DCT 频域</text><text x="445" y="261" font-size="22" fill="#103858">每个通道沿时间变换</text><text x="445" y="300" font-size="22" fill="#103858">低频：慢变化与整体趋势</text><text x="445" y="339" font-size="22" fill="#103858">高频：快速变化与接触细节</text><text x="445" y="378" font-size="22" fill="#103858"></text><rect x="450" y="390" width="300" height="82" rx="10" fill="#eef7ff" stroke="#7542c8" stroke-width="2"/><text x="465" y="422" font-size="23" fill="#7542c8" font-weight="700">平滑信号 → 稀疏系数</text><rect x="815" y="165" width="350" height="560" rx="14" fill="white" stroke="#df624d" stroke-width="2"/><rect x="816" y="166" width="348" height="54" rx="13" fill="#df624d"/><circle cx="845" cy="193" r="18" fill="white"/><text x="845" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#df624d">3</text><text x="875" y="201" font-size="25" fill="white" font-weight="700">量化与展开</text><text x="835" y="261" font-size="22" fill="#103858">Q=round(γC)</text><text x="835" y="300" font-size="22" fill="#103858">按约定顺序展开整数矩阵</text><text x="835" y="339" font-size="22" fill="#103858">γ越大，细节多、token可能更长</text><text x="835" y="378" font-size="22" fill="#103858"></text><rect x="840" y="390" width="300" height="82" rx="10" fill="#eef7ff" stroke="#df624d" stroke-width="2"/><text x="855" y="422" font-size="23" fill="#df624d" font-weight="700">有损步骤：量化</text><rect x="1205" y="165" width="350" height="560" rx="14" fill="white" stroke="#099773" stroke-width="2"/><rect x="1206" y="166" width="348" height="54" rx="13" fill="#099773"/><circle cx="1235" cy="193" r="18" fill="white"/><text x="1235" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#099773">4</text><text x="1265" y="201" font-size="25" fill="white" font-weight="700">BPE 与解码</text><text x="1225" y="261" font-size="22" fill="#103858">合并常见符号组合</text><text x="1225" y="300" font-size="22" fill="#103858">输出 z₁…zᴸ</text><text x="1225" y="339" font-size="22" fill="#103858">逆 BPE → 逆 DCT → 反归一化</text><text x="1225" y="378" font-size="22" fill="#103858"></text><rect x="1230" y="390" width="300" height="82" rx="10" fill="#eef7ff" stroke="#099773" stroke-width="2"/><text x="1245" y="422" font-size="23" fill="#099773" font-weight="700">动作重建 / VLA 标签</text><rect x="16" y="807" width="1568" height="77" rx="12" fill="url(#head)"/><text x="42" y="843" font-size="24" fill="white" font-weight="700">FAST解决的是动作表示效率，不替代控制器和机器人本体适配</text><text x="42" y="871" font-size="17" fill="#d8efff">原创原理示意；数字、坐标和适用条件以正文来源为准。</text></svg>