<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="为什么纯双向自注意力需要顺序信息"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="500" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">为什么纯双向自注意力需要顺序信息</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">无位置信号且无其他顺序线索时，交换输入行会交换输出行。</text><rect x="55" y="165" width="145" height="56" rx="6" fill="#dcecf6" stroke="#2473a6" stroke-width="2"/><text x="127.5" y="201" font-size="24" fill="#2473a6" text-anchor="middle" font-weight="400">狗</text><rect x="235" y="165" width="145" height="56" rx="6" fill="#dcecf6" stroke="#2473a6" stroke-width="2"/><text x="307.5" y="201" font-size="24" fill="#2473a6" text-anchor="middle" font-weight="400">咬</text><rect x="415" y="165" width="145" height="56" rx="6" fill="#dcecf6" stroke="#2473a6" stroke-width="2"/><text x="487.5" y="201" font-size="24" fill="#2473a6" text-anchor="middle" font-weight="400">人</text><rect x="55" y="300" width="145" height="56" rx="6" fill="#dcecf6" stroke="#8061bb" stroke-width="2"/><text x="127.5" y="336" font-size="24" fill="#8061bb" text-anchor="middle" font-weight="400">人</text><rect x="235" y="300" width="145" height="56" rx="6" fill="#dcecf6" stroke="#8061bb" stroke-width="2"/><text x="307.5" y="336" font-size="24" fill="#8061bb" text-anchor="middle" font-weight="400">咬</text><rect x="415" y="300" width="145" height="56" rx="6" fill="#dcecf6" stroke="#8061bb" stroke-width="2"/><text x="487.5" y="336" font-size="24" fill="#8061bb" text-anchor="middle" font-weight="400">狗</text><rect x="680" y="155" width="470" height="230" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="680" y="155" width="5" height="230" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="698" y="189" font-size="24" fill="#278977" text-anchor="start" font-weight="600">相同词集合，不同意思</text><text x="698" y="227" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">纯内容注意力具有置换等变性</text><text x="698" y="267" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">位置编码打破这种对称</text><text x="698" y="307" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">因果遮罩本身也带来顺序线索</text><text x="30" y="476" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创教学示意；示例数值、颜色与头的分工不代表真实模型测量。</text></svg>