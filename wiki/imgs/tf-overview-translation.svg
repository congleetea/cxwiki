<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-label="先看整件事：读懂源句，再根据前缀生成目标句"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="710" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">先看整件事：读懂源句，再根据前缀生成目标句</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">教学例子：把“机器人拿杯子”翻译为英文；每个模块承担不同职责。</text><rect x="30" y="150" width="330" height="160" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="30" y="150" width="5" height="160" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="48" y="184" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">① 输入表示</text><text x="48" y="222" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">源句：机器人拿杯子</text><text x="48" y="262" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">分词 → 嵌入 + 位置信息</text><rect x="435" y="150" width="330" height="160" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="435" y="150" width="5" height="160" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="453" y="184" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">② Encoder</text><text x="453" y="222" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">源位置之间交流信息</text><text x="453" y="262" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">输出一组上下文表示</text><rect x="840" y="150" width="330" height="160" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="840" y="150" width="5" height="160" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="858" y="184" font-size="24" fill="#278977" text-anchor="start" font-weight="600">③ 源记忆</text><text x="858" y="222" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">保留各源位置的表示</text><text x="858" y="262" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">供目标侧反复读取</text><path d="M365 230L425 230" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><path d="M770 230L830 230" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="435" width="330" height="160" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="30" y="435" width="5" height="160" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="48" y="469" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">④ 目标前缀</text><text x="48" y="507" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">起始符 + 已知目标内容</text><text x="48" y="547" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">嵌入 + 位置信息</text><rect x="435" y="435" width="330" height="160" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="435" y="435" width="5" height="160" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="453" y="469" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">⑤ Decoder</text><text x="453" y="507" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">因果自注意力：读前缀</text><text x="453" y="547" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">交叉注意力：读源记忆</text><rect x="840" y="435" width="330" height="160" rx="12" fill="white" stroke="#cf7446" stroke-width="2"/><rect x="840" y="435" width="5" height="160" rx="0" fill="#cf7446" stroke="#cf7446" stroke-width="2"/><text x="858" y="469" font-size="24" fill="#cf7446" text-anchor="start" font-weight="600">⑥ 输出与选择</text><text x="858" y="507" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">词表分布 → 选一个 Token</text><text x="858" y="547" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">本例可依次生成英文句子</text><path d="M365 515L425 515" fill="none" stroke="#8061bb" stroke-width="3" marker-end="url(#arrow)"/><path d="M770 515L830 515" fill="none" stroke="#8061bb" stroke-width="3" marker-end="url(#arrow)"/><path d="M1005 310L1005 370L600 370L600 430" fill="none" stroke="#278977" stroke-width="3" stroke-linejoin="round"/><path d="M600 415L600 432" fill="none" stroke="#278977" stroke-width="3" marker-end="url(#arrow)"/><text x="570" y="352" font-size="22" fill="#278977" text-anchor="start" font-weight="400">源记忆为每个目标位置提供条件</text><path d="M1005 595L1005 637L195 637L195 600" fill="none" stroke="#cf7446" stroke-width="3" stroke-linejoin="round"/><path d="M195 615L195 599" fill="none" stroke="#cf7446" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="628" font-size="22" fill="#cf7446" text-anchor="middle" font-weight="400">生成时把选出的 Token 追加到前缀，继续下一步</text><text x="30" y="686" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创教学数据流；编码器源记忆只需建立一次，解码器每次生成都可继续读取它。</text></svg>