<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="04  为什么引入潜变量：同一条件下可能有多种合理动作"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="580" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">04  为什么引入潜变量：同一条件下可能有多种合理动作</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">示意任务：绕开障碍到达目标；路径仅讲解多模态，不代表真实规划器输出。</text><rect x="40" y="130" width="560" height="340" rx="12" fill="white" stroke="#d6e1ea" stroke-width="2"/><rect x="270" y="240" width="100" height="100" rx="12" fill="#e3e9ef" stroke="#d6e1ea" stroke-width="2"/><text x="320" y="295" font-size="23" fill="#18364d" text-anchor="middle" font-weight="400">障碍</text><text x="80" y="310" font-size="23" fill="#18364d" text-anchor="start" font-weight="400">起点</text><text x="515" y="310" font-size="23" fill="#18364d" text-anchor="start" font-weight="400">目标</text><path d="M140 290 L220 180 L430 180 L505 290" fill="none" stroke="#2473a6" stroke-width="4" stroke-linejoin="round"/><path d="M140 290 L220 400 L430 400 L505 290" fill="none" stroke="#278977" stroke-width="4" stroke-linejoin="round"/><path d="M145 290L500 290" fill="none" stroke="#cf7446" stroke-width="3" stroke-dasharray="7 5"/><text x="280" y="165" font-size="22" fill="#2473a6" text-anchor="start" font-weight="400">上侧模式</text><text x="280" y="435" font-size="22" fill="#278977" text-anchor="start" font-weight="400">下侧模式</text><rect x="650" y="135" width="510" height="335" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="650" y="135" width="5" height="335" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="668" y="169" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">相同条件，不止一个正确答案</text><text x="668" y="207" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">条件：场景、起点与目标</text><text x="668" y="247" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">输出：一段动作或轨迹</text><text x="668" y="287" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">潜变量：区分不同执行模式</text><text x="668" y="327" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">橙色：两条对称路径的逐点均值</text><text x="668" y="367" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">均值可能穿过障碍，未必可执行</text><text x="668" y="407" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">CVAE 能建模多解，但不保证安全</text><text x="30" y="556" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创直觉示例；潜变量不会自动对应可解释技能，需用生成结果验证模型是否真的利用了 z。</text></svg>