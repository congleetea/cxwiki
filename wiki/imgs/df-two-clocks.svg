</svg><text x="58" y="422" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">执行前面几步 → 获取新观测 → 再生成下一块</text><path d="M600 274L600 305" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="490" width="1120" height="100" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="40" y="490" width="5" height="100" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="58" y="524" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">改变积分步数，改变的是生成计算量</text><text x="58" y="562" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">动作块长度、执行频率、执行前缀长度是另外几个参数</text><text x="30" y="666" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创时序图；噪声中间态无需满足机器人轨迹约束，最终命令仍需经过接口与安全检查。</text></svg>