<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-label="退步与恢复都要看见，而不只看视频播放到了哪里"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="530" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">退步与恢复都要看见，而不只看视频播放到了哪里</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">抓住、搬动、滑落、重新抓取、放好；退步不是应当被强制平滑掉的噪声。</text><path d="M90 390L1110 390" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><path d="M90 390L90 130" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><path d="M110.0 390.0 L294.0 302.0 L478.0 236.0 L662.0 324.0 L846.0 258.0 L1030.0 170.0" fill="none" stroke="#2473a6" stroke-width="4" stroke-linejoin="round"/><svg x="105.0" y="364.0" width="10.0" height="15.0" viewBox="0 0 10 15" data-latex="$0$"><ns0:metadata xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
