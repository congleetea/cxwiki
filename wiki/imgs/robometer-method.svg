<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Robometer：轨迹内看进度，轨迹间比质量"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="520" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">Robometer：轨迹内看进度，轨迹间比质量</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">依据 Robometer §III；两个监督来源，训练目标实际上还包含成功预测项。</text><rect x="30" y="145" width="330" height="245" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="30" y="145" width="5" height="245" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="48" y="179" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">两类训练监督</text><text x="48" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">专家帧级进度与成功</text><text x="48" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">专家、失败及增强轨迹对</text><rect x="435" y="145" width="330" height="245" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="435" y="145" width="5" height="245" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="453" y="179" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">视频语言模型</text><text x="453" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">progress token：因果读历史</text><text x="453" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">preference token：读两条轨迹</text><rect x="840" y="145" width="330" height="245" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="840" y="145" width="5" height="245" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="858" y="179" font-size="24" fill="#278977" text-anchor="start" font-weight="600">三项损失</text><text x="858" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">分桶进度交叉熵</text><text x="858" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">成功分类损失</text><text x="858" y="297" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">轨迹偏好分类损失</text><path d="M370 267L425 267" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><path d="M775 267L830 267" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="496" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创机制示意，依据对应原论文重绘；省略网络层数等细节，非论文实验结果。</text></svg>