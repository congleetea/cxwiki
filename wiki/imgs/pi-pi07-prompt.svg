<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="π₀.₇：用提示拆开不同策略"><defs><linearGradient id="head"><stop stop-color="#063c76"/><stop offset="1" stop-color="#087eae"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#397bad" stroke-width="1.5"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="900" fill="#f3f7fc"/><rect x="16" y="16" width="1568" height="112" rx="15" fill="url(#head)"/><text x="45" y="66" font-size="35" fill="white" font-weight="700">π₀.₇：用提示拆开不同策略</text><text x="46" y="103" font-size="20" fill="#d8efff">任务、子任务、子目标、速度、质量、错误和控制模式共同约束动作。</text><rect x="35" y="165" width="450" height="560" rx="14" fill="white" stroke="#087fca" stroke-width="2"/><rect x="36" y="166" width="448" height="54" rx="13" fill="#087fca"/><circle cx="65" cy="193" r="18" fill="white"/><text x="65" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#087fca">1</text><text x="95" y="201" font-size="25" fill="white" font-weight="700">异质轨迹</text><text x="55" y="261" font-size="22" fill="#103858">不同机器人与控制接口</text><text x="55" y="300" font-size="22" fill="#103858">不同速度和质量</text><text x="55" y="339" font-size="22" fill="#103858">成功、失败、自主和人类</text><text x="55" y="378" font-size="22" fill="#103858"></text><rect x="65" y="500" width="390" height="82" rx="10" fill="#eef7ff" stroke="#087fca" stroke-width="2"/><text x="80" y="532" font-size="23" fill="#087fca" font-weight="700">无条件混合会互相平均</text><rect x="575" y="165" width="450" height="560" rx="14" fill="white" stroke="#7542c8" stroke-width="2"/><rect x="576" y="166" width="448" height="54" rx="13" fill="#7542c8"/><circle cx="605" cy="193" r="18" fill="white"/><text x="605" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#7542c8">2</text><text x="635" y="201" font-size="25" fill="white" font-weight="700">多模态条件</text><text x="595" y="261" font-size="22" fill="#103858">语言任务/子任务</text><text x="595" y="300" font-size="22" fill="#103858">未来子目标图像</text><text x="595" y="339" font-size="22" fill="#103858">episode metadata</text><text x="595" y="378" font-size="22" fill="#103858">joint / ee 控制模式</text><text x="595" y="417" font-size="22" fill="#103858"></text><rect x="605" y="500" width="390" height="82" rx="10" fill="#eef7ff" stroke="#7542c8" stroke-width="2"/><text x="620" y="532" font-size="23" fill="#7542c8" font-weight="700">告诉模型“怎么做”</text><rect x="1115" y="165" width="450" height="560" rx="14" fill="white" stroke="#099773" stroke-width="2"/><rect x="1116" y="166" width="448" height="54" rx="13" fill="#099773"/><circle cx="1145" cy="193" r="18" fill="white"/><text x="1145" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#099773">3</text><text x="1175" y="201" font-size="25" fill="white" font-weight="700">可控执行</text><text x="1135" y="261" font-size="22" fill="#103858">dropout 支持条件缺省</text><text x="1135" y="300" font-size="22" fill="#103858">世界模型生成目标图像</text><text x="1135" y="339" font-size="22" fill="#103858">连续专家生成动作块</text><text x="1135" y="378" font-size="22" fill="#103858">coaching 可细化新任务</text><text x="1135" y="417" font-size="22" fill="#103858"></text><rect x="1145" y="500" width="390" height="82" rx="10" fill="#eef7ff" stroke="#099773" stroke-width="2"/><text x="1160" y="532" font-size="23" fill="#099773" font-weight="700">组合泛化与 steerability</text><rect x="16" y="807" width="1568" height="77" rx="12" fill="url(#head)"/><text x="42" y="843" font-size="24" fill="white" font-weight="700">核心链路：多源轨迹 → 条件化表示 → 按意图执行</text><text x="42" y="871" font-size="17" fill="#d8efff">原创原理示意；数字、坐标和适用条件以正文来源为准。</text></svg>