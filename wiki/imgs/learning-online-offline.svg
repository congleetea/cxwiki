<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="在线与离线：训练期间是否继续采集环境经验"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="560" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">在线与离线：训练期间是否继续采集环境经验</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">两条流程都输出策略；区别在训练数据能否随交互扩充。</text><rect x="30" y="135" width="330" height="150" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="30" y="135" width="5" height="150" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="48" y="169" font-size="24" fill="#278977" text-anchor="start" font-weight="600">在线：运行环境</text><text x="48" y="207" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">执行当前采集策略</text><text x="48" y="247" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">得到新转移</text><rect x="435" y="135" width="330" height="150" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="435" y="135" width="5" height="150" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="453" y="169" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">追加数据</text><text x="453" y="207" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">新经验进入缓冲区</text><text x="453" y="247" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">也可按轨迹批次组织</text><rect x="840" y="135" width="330" height="150" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="840" y="135" width="5" height="150" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="858" y="169" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">训练策略</text><text x="858" y="207" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">更新价值或策略</text><text x="858" y="247" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">随后继续采集</text><path d="M365 210L425 210" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 210L830 210" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><path d="M1005 290 L1005 315 L195 315 L195 290" fill="none" stroke="#278977" stroke-width="3" stroke-linejoin="round"/><rect x="30" y="350" width="330" height="145" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="30" y="350" width="5" height="145" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="48" y="384" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">离线：已有日志</text><text x="48" y="422" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">训练期固定数据集</text><rect x="435" y="350" width="330" height="145" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="435" y="350" width="5" height="145" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="453" y="384" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">反复抽样训练</text><text x="453" y="422" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">不追加环境转移</text><rect x="840" y="350" width="330" height="145" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="840" y="350" width="5" height="145" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="858" y="384" font-size="24" fill="#278977" text-anchor="start" font-weight="600">得到策略</text><text x="858" y="422" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">之后可独立部署评估</text><path d="M365 420L425 420" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 420L830 420" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="536" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创教学流程；在线不等于必须逐样本更新，离线不等于没有网络连接。</text></svg>