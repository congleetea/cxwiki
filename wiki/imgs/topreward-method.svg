<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="TOPReward：不让模型报百分比，读取肯定答案的概率"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="520" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">TOPReward：不让模型报百分比，读取肯定答案的概率</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">依据 TOPReward §3；完整轨迹归一化是离线步骤，不自动成为无未来信息的在线校准。</text><rect x="30" y="145" width="330" height="245" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="30" y="145" width="5" height="245" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="48" y="179" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">只取当前视频前缀</text><text x="48" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">视频从起点到当前时刻</text><text x="48" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">任务文字 + 完成判断语境</text><rect x="435" y="145" width="330" height="245" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="435" y="145" width="5" height="245" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="453" y="179" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">计算候选答案概率</text><text x="453" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">读取 True 答案的对数概率</text><text x="453" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">不依赖生成数字是否准确</text><rect x="840" y="145" width="330" height="245" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="840" y="145" width="5" height="245" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="858" y="179" font-size="24" fill="#278977" text-anchor="start" font-weight="600">形成曲线与权重</text><text x="858" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">轨迹内归一化</text><text x="858" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">观察分数增量</text><text x="858" y="297" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">用于检测和 BC 加权</text><path d="M370 267L425 267" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><path d="M775 267L830 267" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="496" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创机制示意，依据对应原论文重绘；省略网络层数等细节，非论文实验结果。</text></svg>