<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="图像描述：初始条件引导序列生成"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="440" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">图像描述：初始条件引导序列生成</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">简化接口示意；图片条件注入方式由模型实现决定。</text><rect x="30.0" y="145" width="264.0" height="200" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="30.0" y="145" width="5" height="200" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="48.0" y="179" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">图片编码</text><text x="48.0" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">图像 → 特征向量</text><path d="M298.0 244L317.0 244" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="322.0" y="145" width="264.0" height="200" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="322.0" y="145" width="5" height="200" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="340.0" y="179" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">初始化 RNN</text><text x="340.0" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">特征作初始状态</text><text x="340.0" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">或额外输入条件</text><path d="M590.0 244L609.0 244" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="614.0" y="145" width="264.0" height="200" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="614.0" y="145" width="5" height="200" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="632.0" y="179" font-size="24" fill="#278977" text-anchor="start" font-weight="600">逐步生成</text><text x="632.0" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">预测：一 / 只 / 猫</text><text x="632.0" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">前一步输出参与后续</text><path d="M882.0 244L901.0 244" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="906.0" y="145" width="264.0" height="200" rx="12" fill="white" stroke="#cf7446" stroke-width="2"/><rect x="906.0" y="145" width="5" height="200" rx="0" fill="#cf7446" stroke="#cf7446" stroke-width="2"/><text x="924.0" y="179" font-size="24" fill="#cf7446" text-anchor="start" font-weight="600">停止</text><text x="924.0" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">生成结束标记</text><text x="30" y="416" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创原理示意；箭头表示数据或计算流。</text></svg>