<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-label="动画 · 图像块依次变成序列位置"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="570" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">动画 · 图像块依次变成序列位置</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">可暂停、拖动进度条与重播；所有步骤均为教学示意。</text><rect x="60" y="170" width="120" height="120" rx="12" fill="#dcecf6" stroke="#2473a6" stroke-width="2"/><text x="120" y="245" font-size="28" fill="#2473a6" text-anchor="middle" font-weight="400">1</text><rect x="460" y="240" width="150" height="56" rx="6" fill="#edf0f4" stroke="#d6e1ea" stroke-width="2"/><text x="535.0" y="276" font-size="24" fill="#607789" text-anchor="middle" font-weight="400">块 1</text><rect x="190" y="170" width="120" height="120" rx="12" fill="#e9e1f5" stroke="#c8d8e5" stroke-width="2"/><text x="250" y="245" font-size="28" fill="#2473a6" text-anchor="middle" font-weight="400">2</text><rect x="635" y="240" width="150" height="56" rx="6" fill="#edf0f4" stroke="#d6e1ea" stroke-width="2"/><text x="710.0" y="276" font-size="24" fill="#607789" text-anchor="middle" font-weight="400">块 2</text><rect x="60" y="300" width="120" height="120" rx="12" fill="#dcefe8" stroke="#c8d8e5" stroke-width="2"/><text x="120" y="375" font-size="28" fill="#2473a6" text-anchor="middle" font-weight="400">3</text><rect x="810" y="240" width="150" height="56" rx="6" fill="#edf0f4" stroke="#d6e1ea" stroke-width="2"/><text x="885.0" y="276" font-size="24" fill="#607789" text-anchor="middle" font-weight="400">块 3</text><rect x="190" y="300" width="120" height="120" rx="12" fill="#f6e7dc" stroke="#c8d8e5" stroke-width="2"/><text x="250" y="375" font-size="28" fill="#2473a6" text-anchor="middle" font-weight="400">4</text><rect x="985" y="240" width="150" height="56" rx="6" fill="#edf0f4" stroke="#d6e1ea" stroke-width="2"/><text x="1060.0" y="276" font-size="24" fill="#607789" text-anchor="middle" font-weight="400">块 4</text><text x="800" y="395" font-size="24" fill="#278977" text-anchor="middle" font-weight="400">块顺序需与位置编码一致</text><text x="30" y="546" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创可视化；慢速逐步显示便于学习，不代表真实硬件的执行时序。</text></svg>