<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-label="① 为什么“平均动作”可能是坏动作"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="570" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">① 为什么“平均动作”可能是坏动作</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">同一个场景允许两种绕行策略；训练目标需要描述分布。</text><rect x="60" y="135" width="590" height="350" rx="12" fill="white" stroke="#d6e1ea" stroke-width="2"/><rect x="303" y="245" width="105" height="110" rx="8" fill="#dce5eb" stroke="#d6e1ea" stroke-width="2"/><text x="355" y="280" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">障碍物</text><circle cx="110" cy="300" r="7" fill="#2473a6"/><text x="110" y="335" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">起点</text><circle cx="595" cy="300" r="7" fill="#2473a6"/><text x="595" y="335" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">终点</text><path d="M110 300 C200 130 480 130 595 300" fill="none" stroke="#2473a6" stroke-width="5" stroke-linejoin="round"/><path d="M110 300 C200 470 480 470 595 300" fill="none" stroke="#278977" stroke-width="5" stroke-linejoin="round"/><path d="M110 300L595 300" fill="none" stroke="#cf7446" stroke-width="4" stroke-dasharray="7 5"/><text x="350" y="155" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">左侧绕行</text><text x="350" y="470" font-size="22" fill="#278977" text-anchor="middle" font-weight="400">右侧绕行</text><rect x="700" y="150" width="450" height="135" rx="12" fill="white" stroke="#cf7446" stroke-width="2"/><rect x="700" y="150" width="5" height="135" rx="0" fill="#cf7446" stroke="#cf7446" stroke-width="2"/><text x="718" y="184" font-size="24" fill="#cf7446" text-anchor="start" font-weight="600">直接回归</text><text x="718" y="222" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">两条演示取平均</text><text x="718" y="262" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">可能穿过中间的障碍物</text><rect x="700" y="320" width="450" height="135" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="700" y="320" width="5" height="135" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="718" y="354" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">条件生成</text><text x="718" y="392" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">在两种合理动作中采样一种</text><text x="718" y="432" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">整段动作共同决定绕行方式</text><text x="30" y="546" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创几何例子；曲线为末端在桌面的物理路径，不是噪声到动作的生成路径。</text></svg>