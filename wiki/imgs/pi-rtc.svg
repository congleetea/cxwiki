<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="RTC：冻结旧块前缀，再补绘新动作"><defs><linearGradient id="head"><stop stop-color="#063c76"/><stop offset="1" stop-color="#087eae"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#397bad" stroke-width="1.5"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="900" fill="#f3f7fc"/><rect x="16" y="16" width="1568" height="112" rx="15" fill="url(#head)"/><text x="45" y="66" font-size="35" fill="white" font-weight="700">RTC：冻结旧块前缀，再补绘新动作</text><text x="46" y="103" font-size="20" fill="#d8efff">冻结已错过的时间步；软约束重叠区域；流模型生成未来动作。</text><rect x="35" y="165" width="450" height="560" rx="14" fill="white" stroke="#087fca" stroke-width="2"/><rect x="36" y="166" width="448" height="54" rx="13" fill="#087fca"/><circle cx="65" cy="193" r="18" fill="white"/><text x="65" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#087fca">1</text><text x="95" y="201" font-size="25" fill="white" font-weight="700">异步延迟</text><text x="55" y="261" font-size="22" fill="#103858">旧块继续执行</text><text x="55" y="300" font-size="22" fill="#103858">新观测到达但推理尚未完成</text><text x="55" y="339" font-size="22" fill="#103858">d=floor(δ/Δt)</text><text x="55" y="378" font-size="22" fill="#103858"></text><rect x="65" y="500" width="390" height="82" rx="10" fill="#eef7ff" stroke="#087fca" stroke-width="2"/><text x="80" y="532" font-size="23" fill="#087fca" font-weight="700">等待会产生停顿</text><rect x="575" y="165" width="450" height="560" rx="14" fill="white" stroke="#df624d" stroke-width="2"/><rect x="576" y="166" width="448" height="54" rx="13" fill="#df624d"/><circle cx="605" cy="193" r="18" fill="white"/><text x="605" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#df624d">2</text><text x="635" y="201" font-size="25" fill="white" font-weight="700">一致性约束</text><text x="595" y="261" font-size="22" fill="#103858">前 d 步：冻结为旧动作</text><text x="595" y="300" font-size="22" fill="#103858">中间区域：衰减权重</text><text x="595" y="339" font-size="22" fill="#103858">末端：自由生成</text><text x="595" y="378" font-size="22" fill="#103858"></text><rect x="605" y="500" width="390" height="82" rx="10" fill="#eef7ff" stroke="#df624d" stroke-width="2"/><text x="620" y="532" font-size="23" fill="#df624d" font-weight="700">连续性与反应性权衡</text><rect x="1115" y="165" width="450" height="560" rx="14" fill="white" stroke="#099773" stroke-width="2"/><rect x="1116" y="166" width="448" height="54" rx="13" fill="#099773"/><circle cx="1145" cy="193" r="18" fill="white"/><text x="1145" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#099773">3</text><text x="1175" y="201" font-size="25" fill="white" font-weight="700">流模型补绘</text><text x="1135" y="261" font-size="22" fill="#103858">噪声动作块 + 旧块目标</text><text x="1135" y="300" font-size="22" fill="#103858">ΠGDM式速度校正</text><text x="1135" y="339" font-size="22" fill="#103858">积分直到完整新块</text><text x="1135" y="378" font-size="22" fill="#103858"></text><rect x="1145" y="500" width="390" height="82" rx="10" fill="#eef7ff" stroke="#099773" stroke-width="2"/><text x="1160" y="532" font-size="23" fill="#099773" font-weight="700">只执行尚未过时的部分</text><rect x="16" y="807" width="1568" height="77" rx="12" fill="url(#head)"/><text x="42" y="843" font-size="24" fill="white" font-weight="700">核心链路：异步执行 → 重叠约束 → 无停顿切换</text><text x="42" y="871" font-size="17" fill="#d8efff">原创原理示意；数字、坐标和适用条件以正文来源为准。</text></svg>