<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="强化学习算法：按模型使用与更新对象理解"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="600" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">强化学习算法：按模型使用与更新对象理解</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">这是一种常见组织方式；Actor–Critic 同时使用策略和价值。</text><rect x="30" y="135" width="340" height="345" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="30" y="135" width="5" height="345" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="48" y="169" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">使用环境模型</text><text x="48" y="207" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">已知或学习模型</text><text x="48" y="247" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">用预测进行规划</text><text x="48" y="287" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">动态规划 / 模型预测控制</text><rect x="410" y="135" width="760" height="110" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="410" y="135" width="5" height="110" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="428" y="169" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">不显式用模型规划</text><text x="428" y="207" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">直接由经验更新价值或策略</text><rect x="410" y="285" width="240" height="195" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="410" y="285" width="5" height="195" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="428" y="319" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">价值方法</text><text x="428" y="357" font-size="21" fill="#18364d" font-weight="400">学习 </text><svg x="474.703125" y="342.0" width="57.0" height="19.0" viewBox="0 0 57 19" data-latex="$Q(s,a)$"><ns0:metadata xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
