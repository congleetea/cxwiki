<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="AllReduce：两张 GPU 的数据如何变化"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="500" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">AllReduce：两张 GPU 的数据如何变化</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">示例用两个元素的向量，展示通信前后每张 GPU 持有的数据。</text><rect x="40" y="145" width="320" height="95" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="40" y="145" width="5" height="95" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="58" y="179" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">GPU 0：[1, 2]</text><rect x="820" y="145" width="340" height="95" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="820" y="145" width="5" height="95" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="838" y="179" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">GPU 0：[4, 6]</text><path d="M370 193L810 193" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="270" width="320" height="95" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="40" y="270" width="5" height="95" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="58" y="304" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">GPU 1：[3, 4]</text><rect x="820" y="270" width="340" height="95" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="820" y="270" width="5" height="95" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="838" y="304" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">GPU 1：[4, 6]</text><path d="M370 318L810 318" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="177" width="300" height="150" rx="12" fill="#ecf2f8" stroke="#d6e1ea" stroke-width="2"/><text x="590" y="228" font-size="24" fill="#2473a6" text-anchor="middle" font-weight="400">AllReduce</text><text x="590" y="272" font-size="22" fill="#607789" text-anchor="middle" font-weight="400">集体通信</text><text x="30" y="476" font-size="19" fill="#607789" text-anchor="start" font-weight="400">逐元素相加，所有卡得到完整结果；图示为语义，不代表实际网络拓扑或通信算法。</text></svg>