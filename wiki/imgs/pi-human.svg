<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="人类视频迁移：共享相对运动和子任务"><defs><linearGradient id="head"><stop stop-color="#063c76"/><stop offset="1" stop-color="#087eae"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#397bad" stroke-width="1.5"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="900" fill="#f3f7fc"/><rect x="16" y="16" width="1568" height="112" rx="15" fill="url(#head)"/><text x="45" y="66" font-size="35" fill="white" font-weight="700">人类视频迁移：共享相对运动和子任务</text><text x="46" y="103" font-size="20" fill="#d8efff">人类数据补充场景与语义，机器人数据保留夹爪与本体执行。</text><rect x="35" y="165" width="450" height="560" rx="14" fill="white" stroke="#087fca" stroke-width="2"/><rect x="36" y="166" width="448" height="54" rx="13" fill="#087fca"/><circle cx="65" cy="193" r="18" fill="white"/><text x="65" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#087fca">1</text><text x="95" y="201" font-size="25" fill="white" font-weight="700">人类视频</text><text x="55" y="261" font-size="22" fill="#103858">头戴相机 SLAM：eₜ∈SE(3)</text><text x="55" y="300" font-size="22" fill="#103858">手部 3D 关键点</text><text x="55" y="339" font-size="22" fill="#103858">相对末端动作 Δp,ΔR</text><text x="55" y="378" font-size="22" fill="#103858"></text><rect x="65" y="500" width="390" height="82" rx="10" fill="#eef7ff" stroke="#087fca" stroke-width="2"/><text x="80" y="532" font-size="23" fill="#087fca" font-weight="700">没有可靠的夹爪开度</text><rect x="575" y="165" width="450" height="560" rx="14" fill="white" stroke="#7542c8" stroke-width="2"/><rect x="576" y="166" width="448" height="54" rx="13" fill="#7542c8"/><circle cx="605" cy="193" r="18" fill="white"/><text x="605" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#7542c8">2</text><text x="635" y="201" font-size="25" fill="white" font-weight="700">共享 VLA 表示</text><text x="595" y="261" font-size="22" fill="#103858">子任务文字标注</text><text x="595" y="300" font-size="22" fill="#103858">高层：预测下一子任务</text><text x="595" y="339" font-size="22" fill="#103858">低层：动作块预测</text><text x="595" y="378" font-size="22" fill="#103858">人类与机器人同一训练目标</text><text x="595" y="417" font-size="22" fill="#103858"></text><rect x="605" y="500" width="390" height="82" rx="10" fill="#eef7ff" stroke="#7542c8" stroke-width="2"/><text x="620" y="532" font-size="23" fill="#7542c8" font-weight="700">跨场景 / 物体 / 任务</text><rect x="1115" y="165" width="450" height="560" rx="14" fill="white" stroke="#099773" stroke-width="2"/><rect x="1116" y="166" width="448" height="54" rx="13" fill="#099773"/><circle cx="1145" cy="193" r="18" fill="white"/><text x="1145" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#099773">3</text><text x="1175" y="201" font-size="25" fill="white" font-weight="700">机器人接口</text><text x="1135" y="261" font-size="22" fill="#103858">相对动作 → 本体适配器</text><text x="1135" y="300" font-size="22" fill="#103858">夹爪与接触由机器人数据学习</text><text x="1135" y="339" font-size="22" fill="#103858">控制器检查可达、碰撞和延迟</text><text x="1135" y="378" font-size="22" fill="#103858"></text><rect x="1145" y="500" width="390" height="82" rx="10" fill="#eef7ff" stroke="#099773" stroke-width="2"/><text x="1160" y="532" font-size="23" fill="#099773" font-weight="700">视频不是逐帧遥控</text><rect x="16" y="807" width="1568" height="77" rx="12" fill="url(#head)"/><text x="42" y="843" font-size="24" fill="white" font-weight="700">核心链路：人类情境 → 共享表示 → 机器人可执行接口</text><text x="42" y="871" font-size="17" fill="#d8efff">原创原理示意；数字、坐标和适用条件以正文来源为准。</text></svg>