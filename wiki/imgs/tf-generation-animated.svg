<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-label="动画 · 下一个 Token 成为下一步的输入"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="570" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">动画 · 下一个 Token 成为下一步的输入</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">可暂停、拖动进度条与重播；所有步骤均为教学示意。</text><rect x="40" y="185" width="205" height="56" rx="6" fill="#dcecf6" stroke="#278977" stroke-width="2"/><text x="142.5" y="221" font-size="24" fill="#278977" text-anchor="middle" font-weight="400">BOS</text><rect x="270" y="185" width="205" height="56" rx="6" fill="#edf0f4" stroke="#d6e1ea" stroke-width="2"/><text x="372.5" y="221" font-size="24" fill="#607789" text-anchor="middle" font-weight="400">我</text><rect x="500" y="185" width="205" height="56" rx="6" fill="#edf0f4" stroke="#d6e1ea" stroke-width="2"/><text x="602.5" y="221" font-size="24" fill="#607789" text-anchor="middle" font-weight="400">爱</text><rect x="730" y="185" width="205" height="56" rx="6" fill="#edf0f4" stroke="#d6e1ea" stroke-width="2"/><text x="832.5" y="221" font-size="24" fill="#607789" text-anchor="middle" font-weight="400">机器人</text><rect x="960" y="185" width="205" height="56" rx="6" fill="#edf0f4" stroke="#d6e1ea" stroke-width="2"/><text x="1062.5" y="221" font-size="24" fill="#607789" text-anchor="middle" font-weight="400">EOS</text><rect x="175" y="320" width="850" height="150" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="175" y="320" width="5" height="150" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="193" y="354" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">前缀 → 模型 → 下一 Token</text><text x="193" y="392" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">当前已经给出 1 个 Token；下一步继续或在 EOS 停止</text><text x="193" y="432" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">模型参数保持不变；改变的是前缀与本次计算状态。</text><text x="30" y="546" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创可视化；慢速逐步显示便于学习，不代表真实硬件的执行时序。</text></svg>