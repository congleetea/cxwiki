<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="同一骨架能处理不同模态，但表示与目标不同"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="500" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">同一骨架能处理不同模态，但表示与目标不同</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400"></text><rect x="30" y="150" width="350" height="235" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="30" y="150" width="5" height="235" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="48" y="184" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">文本</text><text x="48" y="222" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">离散 Token → 嵌入</text><text x="48" y="262" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">GPT：预测下个 Token</text><text x="48" y="302" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">BERT：预测遮盖位置</text><rect x="425" y="150" width="350" height="235" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="425" y="150" width="5" height="235" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="443" y="184" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">图像</text><text x="443" y="222" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">Patch → 线性投影</text><text x="443" y="262" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">ViT：分类或视觉表示</text><text x="443" y="302" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">Patch 不是离散单词</text><rect x="820" y="150" width="350" height="235" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="820" y="150" width="5" height="235" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="838" y="184" font-size="24" fill="#278977" text-anchor="start" font-weight="600">机器人动作</text><text x="838" y="222" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">状态、图像与动作表示</text><text x="838" y="262" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">可做回归、扩散或 flow</text><text x="838" y="302" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">不能看到 Transformer 就认定是 GPT</text><text x="30" y="476" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创教学示意；示例数值、颜色与头的分工不代表真实模型测量。</text></svg>