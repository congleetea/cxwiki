<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-label="流水线并行：层分到不同 GPU，微批次依次经过"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="550" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">流水线并行：层分到不同 GPU，微批次依次经过</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">只示意前向调度；真实训练还需要反向、激活传递和具体调度。</text><text x="35" y="175" font-size="22" fill="#2473a6" text-anchor="start" font-weight="400">GPU 0</text><rect x="165" y="140" width="140" height="55" rx="12" fill="#dcecf6" stroke="#d6e1ea" stroke-width="2"/><text x="235" y="176" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">微批次 1</text><rect x="320" y="140" width="140" height="55" rx="12" fill="#e9e1f5" stroke="#d6e1ea" stroke-width="2"/><text x="390" y="176" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">微批次 2</text><rect x="475" y="140" width="140" height="55" rx="12" fill="#dcefe8" stroke="#d6e1ea" stroke-width="2"/><text x="545" y="176" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">微批次 3</text><text x="35" y="245" font-size="22" fill="#2473a6" text-anchor="start" font-weight="400">GPU 1</text><rect x="320" y="210" width="140" height="55" rx="12" fill="#dcecf6" stroke="#d6e1ea" stroke-width="2"/><text x="390" y="246" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">微批次 1</text><rect x="475" y="210" width="140" height="55" rx="12" fill="#e9e1f5" stroke="#d6e1ea" stroke-width="2"/><text x="545" y="246" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">微批次 2</text><rect x="630" y="210" width="140" height="55" rx="12" fill="#dcefe8" stroke="#d6e1ea" stroke-width="2"/><text x="700" y="246" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">微批次 3</text><text x="35" y="315" font-size="22" fill="#2473a6" text-anchor="start" font-weight="400">GPU 2</text><rect x="475" y="280" width="140" height="55" rx="12" fill="#dcecf6" stroke="#d6e1ea" stroke-width="2"/><text x="545" y="316" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">微批次 1</text><rect x="630" y="280" width="140" height="55" rx="12" fill="#e9e1f5" stroke="#d6e1ea" stroke-width="2"/><text x="700" y="316" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">微批次 2</text><rect x="785" y="280" width="140" height="55" rx="12" fill="#dcefe8" stroke="#d6e1ea" stroke-width="2"/><text x="855" y="316" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">微批次 3</text><text x="35" y="385" font-size="22" fill="#2473a6" text-anchor="start" font-weight="400">GPU 3</text><rect x="630" y="350" width="140" height="55" rx="12" fill="#dcecf6" stroke="#d6e1ea" stroke-width="2"/><text x="700" y="386" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">微批次 1</text><rect x="785" y="350" width="140" height="55" rx="12" fill="#e9e1f5" stroke="#d6e1ea" stroke-width="2"/><text x="855" y="386" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">微批次 2</text><rect x="940" y="350" width="140" height="55" rx="12" fill="#dcefe8" stroke="#d6e1ea" stroke-width="2"/><text x="1010" y="386" font-size="21" fill="#18364d" text-anchor="middle" font-weight="400">微批次 3</text><text x="170" y="465" font-size="23" fill="#18364d" text-anchor="start" font-weight="400">时间步  →</text><text x="30" y="526" font-size="19" fill="#607789" text-anchor="start" font-weight="400">斜向错开让相邻设备处理不同微批次；空白为流水线启动或排空的气泡。</text></svg>