<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="ViT：把图片切成 Patch，再送入编码器"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="600" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">ViT：把图片切成 Patch，再送入编码器</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">示意四乘四图像块；实际 Patch 大小由模型配置决定。</text><rect x="45" y="160" width="63" height="63" rx="0" fill="#dcecf6" stroke="#d6e1ea" stroke-width="2"/><text x="76" y="200" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">1</text><rect x="112" y="160" width="63" height="63" rx="0" fill="#e9e1f5" stroke="#d6e1ea" stroke-width="2"/><text x="143" y="200" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">2</text><rect x="179" y="160" width="63" height="63" rx="0" fill="#dcefe8" stroke="#d6e1ea" stroke-width="2"/><text x="210" y="200" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">3</text><rect x="246" y="160" width="63" height="63" rx="0" fill="#f6e7dc" stroke="#d6e1ea" stroke-width="2"/><text x="277" y="200" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">4</text><rect x="45" y="227" width="63" height="63" rx="0" fill="#e9e1f5" stroke="#d6e1ea" stroke-width="2"/><text x="76" y="267" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">5</text><rect x="112" y="227" width="63" height="63" rx="0" fill="#dcefe8" stroke="#d6e1ea" stroke-width="2"/><text x="143" y="267" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">6</text><rect x="179" y="227" width="63" height="63" rx="0" fill="#f6e7dc" stroke="#d6e1ea" stroke-width="2"/><text x="210" y="267" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">7</text><rect x="246" y="227" width="63" height="63" rx="0" fill="#dcecf6" stroke="#d6e1ea" stroke-width="2"/><text x="277" y="267" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">8</text><rect x="45" y="294" width="63" height="63" rx="0" fill="#dcefe8" stroke="#d6e1ea" stroke-width="2"/><text x="76" y="334" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">9</text><rect x="112" y="294" width="63" height="63" rx="0" fill="#f6e7dc" stroke="#d6e1ea" stroke-width="2"/><text x="143" y="334" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">10</text><rect x="179" y="294" width="63" height="63" rx="0" fill="#dcecf6" stroke="#d6e1ea" stroke-width="2"/><text x="210" y="334" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">11</text><rect x="246" y="294" width="63" height="63" rx="0" fill="#e9e1f5" stroke="#d6e1ea" stroke-width="2"/><text x="277" y="334" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">12</text><rect x="45" y="361" width="63" height="63" rx="0" fill="#f6e7dc" stroke="#d6e1ea" stroke-width="2"/><text x="76" y="401" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">13</text><rect x="112" y="361" width="63" height="63" rx="0" fill="#dcecf6" stroke="#d6e1ea" stroke-width="2"/><text x="143" y="401" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">14</text><rect x="179" y="361" width="63" height="63" rx="0" fill="#e9e1f5" stroke="#d6e1ea" stroke-width="2"/><text x="210" y="401" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">15</text><rect x="246" y="361" width="63" height="63" rx="0" fill="#dcefe8" stroke="#d6e1ea" stroke-width="2"/><text x="277" y="401" font-size="22" fill="#2473a6" text-anchor="middle" font-weight="400">16</text><path d="M345 290L450 290" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="160" width="300" height="250" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="465" y="160" width="5" height="250" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="483" y="194" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">块向量与位置</text><text x="483" y="232" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">每块展平 → 线性投影</text><text x="483" y="272" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">加入位置嵌入</text><text x="483" y="312" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">可加入分类 Token</text><text x="483" y="352" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">不需要先做词表查找</text><path d="M775 290L830 290" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="845" y="160" width="320" height="250" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="845" y="160" width="5" height="250" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="863" y="194" font-size="24" fill="#278977" text-anchor="start" font-weight="600">Transformer Encoder</text><text x="863" y="232" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">块之间双向读取</text><text x="863" y="272" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">FFN 与残差处理</text><text x="863" y="312" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">分类头输出类别</text><text x="863" y="352" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">其他任务可读空间表示</text><text x="30" y="576" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创教学示意；示例数值、颜色与头的分工不代表真实模型测量。</text></svg>