<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="别只问哪个模型更强：先问需要它输出什么"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="620" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">别只问哪个模型更强：先问需要它输出什么</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">模型名字中的 value / reward 不能替代输入输出与监督定义。</text><rect x="30" y="140" width="545" height="175" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="30" y="140" width="5" height="175" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="48" y="174" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">技能选择</text><text x="48" y="212" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">当前技能能否成功？</text><text x="48" y="252" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">SayCan</text><rect x="625" y="140" width="545" height="175" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="625" y="140" width="5" height="175" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="643" y="174" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">无任务专门训练的读出</text><text x="643" y="212" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">能否用现有 VLM 给视频打分？</text><text x="643" y="252" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">GVL / TOPReward</text><rect x="30" y="350" width="545" height="175" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="30" y="350" width="5" height="175" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="48" y="384" font-size="24" fill="#278977" text-anchor="start" font-weight="600">监督式进度与失败识别</text><text x="48" y="422" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">阶段、比较、相对变化如何标注？</text><text x="48" y="462" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">SARM / Robometer / ARM</text><rect x="625" y="350" width="545" height="175" rx="12" fill="white" stroke="#cf7446" stroke-width="2"/><rect x="625" y="350" width="5" height="175" rx="0" fill="#cf7446" stroke="#cf7446" stroke-width="2"/><text x="643" y="384" font-size="24" fill="#cf7446" text-anchor="start" font-weight="600">把评分接到策略改进</text><text x="643" y="422" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">怎样塑造奖励、处理新分布？</text><text x="643" y="462" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">Robo-Dopamine / SARM2 + SPIRAL</text><text x="30" y="596" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创职责对照；同一方法可覆盖多个方向，方框用于建立阅读入口，不作为互斥分类或性能排序。</text></svg>