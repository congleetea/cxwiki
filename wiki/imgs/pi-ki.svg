<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Knowledge Insulation：信息能读，噪声梯度不写回"><defs><linearGradient id="head"><stop stop-color="#063c76"/><stop offset="1" stop-color="#087eae"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#397bad" stroke-width="1.5"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="900" fill="#f3f7fc"/><rect x="16" y="16" width="1568" height="112" rx="15" fill="url(#head)"/><text x="45" y="66" font-size="35" fill="white" font-weight="700">Knowledge Insulation：信息能读，噪声梯度不写回</text><text x="46" y="103" font-size="20" fill="#d8efff">离散 token loss 训练主干；流匹配 loss 训练动作专家。</text><rect x="35" y="165" width="455" height="560" rx="14" fill="white" stroke="#087fca" stroke-width="2"/><rect x="36" y="166" width="453" height="54" rx="13" fill="#087fca"/><circle cx="65" cy="193" r="18" fill="white"/><text x="65" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#087fca">1</text><text x="95" y="201" font-size="25" fill="white" font-weight="700">两类损失</text><text x="55" y="261" font-size="22" fill="#103858">L_AR：下一个离散 token</text><text x="55" y="300" font-size="22" fill="#103858">L_FM：连续动作速度场</text><text x="55" y="339" font-size="22" fill="#103858">同一次前向可共享表示</text><text x="55" y="378" font-size="22" fill="#103858"></text><rect x="65" y="420" width="395" height="82" rx="10" fill="#eef7ff" stroke="#087fca" stroke-width="2"/><text x="80" y="452" font-size="23" fill="#087fca" font-weight="700">主干需要稳定的机器人表示</text><rect x="570" y="165" width="455" height="560" rx="14" fill="white" stroke="#df624d" stroke-width="2"/><rect x="571" y="166" width="453" height="54" rx="13" fill="#df624d"/><circle cx="600" cy="193" r="18" fill="white"/><text x="600" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#df624d">2</text><text x="630" y="201" font-size="25" fill="white" font-weight="700">梯度路径</text><text x="590" y="261" font-size="22" fill="#103858">AR loss ─────→ VLM 主干</text><text x="590" y="300" font-size="22" fill="#103858">FM loss ─────→ 动作专家</text><text x="590" y="339" font-size="22" fill="#103858">FM 到主干经过 stop-gradient</text><text x="590" y="378" font-size="22" fill="#103858">前向注意力仍读取主干特征</text><text x="590" y="417" font-size="22" fill="#103858"></text><rect x="600" y="510" width="395" height="82" rx="10" fill="#eef7ff" stroke="#df624d" stroke-width="2"/><text x="615" y="542" font-size="23" fill="#df624d" font-weight="700">信息流 ≠ 梯度流</text><rect x="1115" y="165" width="450" height="560" rx="14" fill="white" stroke="#099773" stroke-width="2"/><rect x="1116" y="166" width="448" height="54" rx="13" fill="#099773"/><circle cx="1145" cy="193" r="18" fill="white"/><text x="1145" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#099773">3</text><text x="1175" y="201" font-size="25" fill="white" font-weight="700">为何有用</text><text x="1135" y="261" font-size="22" fill="#103858">避免随机初始化专家污染预训练表征</text><text x="1135" y="300" font-size="22" fill="#103858">主干仍可由离散动作继续适配</text><text x="1135" y="339" font-size="22" fill="#103858">专家读取主干并学习连续控制</text><text x="1135" y="378" font-size="22" fill="#103858">代价：需要额外 token 监督与实现细节</text><text x="1135" y="417" font-size="22" fill="#103858"></text><rect x="1145" y="510" width="390" height="82" rx="10" fill="#eef7ff" stroke="#099773" stroke-width="2"/><text x="1160" y="542" font-size="23" fill="#099773" font-weight="700">保护迁移，同时允许适配</text><rect x="16" y="807" width="1568" height="77" rx="12" fill="url(#head)"/><text x="42" y="843" font-size="24" fill="white" font-weight="700">知识绝缘的边界：它改变训练梯度，不是冻结 VLM，也不是切断前向信息</text><text x="42" y="871" font-size="17" fill="#d8efff">原创原理示意；数字、坐标和适用条件以正文来源为准。</text></svg>