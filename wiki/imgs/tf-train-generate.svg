<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="06 · 训练能并行算损失，生成依赖已生成前缀"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="500" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">06 · 训练能并行算损失，生成依赖已生成前缀</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400"></text><rect x="30" y="150" width="350" height="235" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="30" y="150" width="5" height="235" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="48" y="184" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">Teacher forcing</text><text x="48" y="222" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">输入真实目标的右移序列</text><text x="48" y="262" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">因果遮罩阻止未来信息</text><text x="48" y="302" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">所有有效位置一起算损失</text><path d="M385 267L420 267" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="425" y="150" width="350" height="235" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="425" y="150" width="5" height="235" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="443" y="184" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">反向传播</text><text x="443" y="222" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">对目标 Token 计算交叉熵</text><text x="443" y="262" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">梯度更新模型参数</text><text x="443" y="302" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">不是逐个 Token 调优化器</text><path d="M780 267L815 267" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="150" width="350" height="235" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="820" y="150" width="5" height="235" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="838" y="184" font-size="24" fill="#278977" text-anchor="start" font-weight="600">自回归生成</text><text x="838" y="222" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">只给提示与已有输出</text><text x="838" y="262" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">每步选出下一个 Token</text><text x="838" y="302" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">采样结果再作为下步输入</text><text x="30" y="476" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创教学示意；示例数值、颜色与头的分工不代表真实模型测量。</text></svg>