<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-label="PEFT：只更新少量参数的三条路线"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="530" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">PEFT：只更新少量参数的三条路线</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">按主要机制组织，不把所有变体塞进一张小字树状图。</text><rect x="30" y="155" width="360" height="270" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="30" y="155" width="5" height="270" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="48" y="189" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">添加参数</text><text x="48" y="227" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">冻结主干，插入小模块</text><text x="48" y="267" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">Adapter / Prefix / Prompt</text><text x="48" y="307" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">保留独立的任务参数</text><rect x="420" y="155" width="360" height="270" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="420" y="155" width="5" height="270" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="438" y="189" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">选择参数</text><text x="438" y="227" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">只训练已有权重的一部分</text><text x="438" y="267" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">示例：只更新 bias 的 BitFit</text><text x="438" y="307" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">其余参数保持冻结</text><rect x="810" y="155" width="360" height="270" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="810" y="155" width="5" height="270" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="828" y="189" font-size="24" fill="#278977" text-anchor="start" font-weight="600">重参数化更新</text><text x="828" y="227" font-size="21" fill="#18364d" font-weight="400">用低秩因子表示 </text><svg x="979.703125" y="212.0" width="33.0" height="16.0" viewBox="0 0 33 16" data-latex="$\Delta W$"><ns0:metadata xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
