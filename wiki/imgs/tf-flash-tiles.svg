<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="FlashAttention：改变计算与存取方式"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="540" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">FlashAttention：改变计算与存取方式</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">精确注意力的分块计算；不是把每行注意力随意截断。</text><rect x="65" y="155" width="62" height="62" rx="0" fill="#c0daeb" stroke="#2473a6" stroke-width="2"/><rect x="131" y="155" width="62" height="62" rx="0" fill="#dcecf6" stroke="#2473a6" stroke-width="2"/><rect x="197" y="155" width="62" height="62" rx="0" fill="#c0daeb" stroke="#2473a6" stroke-width="2"/><rect x="263" y="155" width="62" height="62" rx="0" fill="#dcecf6" stroke="#2473a6" stroke-width="2"/><rect x="65" y="221" width="62" height="62" rx="0" fill="#dcecf6" stroke="#2473a6" stroke-width="2"/><rect x="131" y="221" width="62" height="62" rx="0" fill="#c0daeb" stroke="#2473a6" stroke-width="2"/><rect x="197" y="221" width="62" height="62" rx="0" fill="#dcecf6" stroke="#2473a6" stroke-width="2"/><rect x="263" y="221" width="62" height="62" rx="0" fill="#c0daeb" stroke="#2473a6" stroke-width="2"/><rect x="65" y="287" width="62" height="62" rx="0" fill="#c0daeb" stroke="#2473a6" stroke-width="2"/><rect x="131" y="287" width="62" height="62" rx="0" fill="#dcecf6" stroke="#2473a6" stroke-width="2"/><rect x="197" y="287" width="62" height="62" rx="0" fill="#c0daeb" stroke="#2473a6" stroke-width="2"/><rect x="263" y="287" width="62" height="62" rx="0" fill="#dcecf6" stroke="#2473a6" stroke-width="2"/><rect x="65" y="353" width="62" height="62" rx="0" fill="#dcecf6" stroke="#2473a6" stroke-width="2"/><rect x="131" y="353" width="62" height="62" rx="0" fill="#c0daeb" stroke="#2473a6" stroke-width="2"/><rect x="197" y="353" width="62" height="62" rx="0" fill="#dcecf6" stroke="#2473a6" stroke-width="2"/><rect x="263" y="353" width="62" height="62" rx="0" fill="#c0daeb" stroke="#2473a6" stroke-width="2"/><text x="190" y="460" font-size="23" fill="#2473a6" text-anchor="middle" font-weight="400">分块处理分数</text><rect x="490" y="155" width="660" height="270" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="490" y="155" width="5" height="270" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="508" y="189" font-size="24" fill="#278977" text-anchor="start" font-weight="600">边读块，边更新稳定 softmax</text><text x="508" y="227" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">每行维护当前最大值、指数和与加权输出</text><text x="508" y="267" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">新最大值出现时，旧累加器重新缩放</text><text x="508" y="307" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">不必把完整注意力矩阵写回显存</text><text x="508" y="347" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">普通 dense 情况算术量仍随长度平方增长</text><text x="30" y="516" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创教学示意；示例数值、颜色与头的分工不代表真实模型测量。</text></svg>