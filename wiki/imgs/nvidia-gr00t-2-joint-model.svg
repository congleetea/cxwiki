<text x="60" y="463" font-size="26" fill="#103858" font-weight="400" text-anchor="start">视频潜变量 → patch token</text>
<rect x="530" y="380" width="360" height="115" rx="14" fill="white" stroke="#07569b" stroke-width="2.5"/>
<text x="550" y="420" font-size="29" fill="#07569b" font-weight="700" text-anchor="start">状态 token</text>
<text x="550" y="463" font-size="26" fill="#103858" font-weight="400" text-anchor="start">共享主干的表示宽度</text>
<rect x="40" y="540" width="1360" height="280" rx="14" fill="white" stroke="#7542c8" stroke-width="2.5"/>
<text x="65" y="585" font-size="31" fill="#7542c8" font-weight="700" text-anchor="start">④ 共享 2B DiT：联合去噪未来视频与动作</text>
<rect x="70" y="620" width="330" height="65" rx="14" fill="#f3f7fc" stroke="#07569b" stroke-width="2.5"/>
