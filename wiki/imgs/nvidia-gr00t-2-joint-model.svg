<text x="600.0" y="662" font-size="27" fill="#7542c8" font-weight="700" text-anchor="middle">带噪未来视频</text>
<rect x="800" y="620" width="220" height="65" rx="14" fill="#f3f7fc" stroke="#07569b" stroke-width="2.5"/>
<text x="910.0" y="662" font-size="27" fill="#07569b" font-weight="700" text-anchor="middle">状态</text>
