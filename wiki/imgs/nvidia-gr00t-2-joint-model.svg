<text x="60" y="963" font-size="26" fill="#103858" font-weight="400" text-anchor="start">可选解码 RGB，用于查看预测</text>
<rect x="690" y="880" width="710" height="135" rx="14" fill="white" stroke="#099773" stroke-width="2.5"/>
<text x="710" y="920" font-size="29" fill="#099773" font-weight="700" text-anchor="start">⑥ 未来动作块 → 本体控制接口</text>
<text x="710" y="963" font-size="26" fill="#103858" font-weight="400" text-anchor="start">执行一部分 → 读取真实新观测 → 重新预测</text>
<text x="40" y="1068" font-size="24" fill="#557087" font-weight="400" text-anchor="start">原创示意 · 依据白皮书 §2 / §4.1 / I.1；未展开完整注意力掩码。</text>
