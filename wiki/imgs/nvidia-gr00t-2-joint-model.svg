<text x="700" y="744" font-size="28" fill="#7542c8" font-weight="700" text-anchor="start">动作读取正在生成的未来视频</text>
<text x="70" y="788" font-size="27" fill="#103858" font-weight="400" text-anchor="start">视频与动作分别计算流匹配损失；动作损失仅用于有效标签。</text>
<path d="M330 820V870" fill="none" stroke="#397bad" stroke-width="3" marker-end="url(#a)"/>
