<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="用固定核理解边缘响应"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="440" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">用固定核理解边缘响应</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">这里展示固定核的直觉；真实 CNN 的核通常由训练学习。</text><rect x="30.0" y="145" width="361.3333333333333" height="200" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="30.0" y="145" width="5" height="200" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="48.0" y="179" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">图像局部</text><text x="48.0" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">比较相邻列的强度</text><path d="M395.3333333333333 244L414.3333333333333 244" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="419.3333333333333" y="145" width="361.3333333333333" height="200" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="419.3333333333333" y="145" width="5" height="200" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="437.3333333333333" y="179" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">水平差分核</text><text x="437.3333333333333" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">每行权重 [−1, 0, 1]</text><path d="M784.6666666666666 244L803.6666666666666 244" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="808.6666666666666" y="145" width="361.3333333333333" height="200" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="808.6666666666666" y="145" width="5" height="200" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="826.6666666666666" y="179" font-size="24" fill="#278977" text-anchor="start" font-weight="600">响应图</text><text x="826.6666666666666" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">左右强度变化大</text><text x="826.6666666666666" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">对竖直边界响应更强</text><text x="30" y="416" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创原理示意；箭头表示数据或计算流。</text></svg>