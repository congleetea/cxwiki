<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="SPIRAL：奖励模型是反馈环的一部分，不是动作策略"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="520" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">SPIRAL：奖励模型是反馈环的一部分，不是动作策略</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">依据 SARM2 §3.2；一次性标注不代表没有前期人工成本或永远不需检查新分布。</text><rect x="30" y="145" width="330" height="245" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="30" y="145" width="5" height="245" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="48" y="179" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">初始化与一次适配</text><text x="48" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">示范 BC 初始化 VLA</text><text x="48" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">少量 rollout 人工标注</text><text x="48" y="297" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">适配奖励模型</text><rect x="435" y="145" width="330" height="245" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="435" y="145" width="5" height="245" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="453" y="179" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">自主采样与重标注</text><text x="453" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">策略运行真实环境</text><text x="453" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">奖励模型标注密集分数</text><rect x="840" y="145" width="330" height="245" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="840" y="145" width="5" height="245" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="858" y="179" font-size="24" fill="#278977" text-anchor="start" font-weight="600">残差 RL 与重复</text><text x="858" y="217" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">基础动作 + 残差修正</text><text x="858" y="257" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">更新策略，再采集</text><text x="858" y="297" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">持续监测奖励失真</text><path d="M370 267L425 267" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><path d="M775 267L830 267" fill="none" stroke="#2473a6" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="496" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创机制示意，依据对应原论文重绘；省略网络层数等细节，非论文实验结果。</text></svg>