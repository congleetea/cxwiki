<text x="790" y="381" font-size="26" fill="#103858" font-weight="400" text-anchor="start">50 Hz 状态反馈</text>
<rect x="1140" y="260" width="260" height="175" rx="14" fill="white" stroke="#cf604d" stroke-width="2.5"/>
<text x="1160" y="300" font-size="29" fill="#cf604d" font-weight="700" text-anchor="start">关节 PD</text>
