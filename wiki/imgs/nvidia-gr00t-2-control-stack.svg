<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-label="Turbo + SONIC：推理、运动与平衡各有时间尺度"><defs><linearGradient id="head"><stop stop-color="#063c76"/><stop offset="1" stop-color="#087eae"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M1 1L10 5L1 9" fill="none" stroke="#397bad" stroke-width="1.8"/></marker></defs><style>text{font-family:"Noto Sans CJK SC",sans-serif}</style><rect width="1440" height="780" fill="#f3f7fc"/><rect x="24" y="24" width="1392" height="118" rx="16" fill="url(#head)"/>
<text x="48" y="73" font-size="36" fill="white" font-weight="700" text-anchor="start">Turbo + SONIC：推理、运动与平衡各有时间尺度</text>
<text x="48" y="116" font-size="25" fill="#d8efff" font-weight="400" text-anchor="start">1 Hz 重规划 ≠ 50 Hz 运动追踪 ≠ 1 kHz 电机控制。</text>
