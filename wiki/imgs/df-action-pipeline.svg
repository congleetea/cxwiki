<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="⑦ 从生成向量到机器人动作"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="650" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">⑦ 从生成向量到机器人动作</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">以基座坐标系下的末端位置增量和夹爪命令为教学接口。</text><rect x="35" y="140" width="340" height="160" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="35" y="140" width="5" height="160" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="53" y="174" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">当前条件</text><text x="53" y="212" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">相机图像、机器人状态</text><text x="53" y="252" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">任务指令（若使用语言）</text><text x="53" y="292" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">编码后作为每步生成的条件</text><rect x="430" y="140" width="340" height="160" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="430" y="140" width="5" height="160" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="448" y="174" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">条件生成器</text><text x="448" y="212" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">随机动作表作为起点</text><text x="448" y="252" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">去噪 / 速度积分</text><text x="448" y="292" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">输出归一化动作块</text><rect x="825" y="140" width="340" height="160" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="825" y="140" width="5" height="160" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="843" y="174" font-size="24" fill="#278977" text-anchor="start" font-weight="600">接口转换</text><text x="843" y="212" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">反归一化与单位恢复</text><text x="843" y="252" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">坐标系与旋转表示转换</text><text x="843" y="292" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">约束检查、控制器跟踪</text><path d="M380 220L425 220" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><path d="M775 220L820 220" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="430" y="385" width="735" height="135" rx="12" fill="white" stroke="#cf7446" stroke-width="2"/><rect x="430" y="385" width="5" height="135" rx="0" fill="#cf7446" stroke="#cf7446" stroke-width="2"/><text x="448" y="419" font-size="24" fill="#cf7446" text-anchor="start" font-weight="600">只执行动作块的前缀</text><text x="448" y="457" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">机器人运动 → 相机与状态更新 → 下一次生成</text><text x="448" y="497" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">分布上合理，不等于必然可达、无碰撞或满足力矩限制</text><path d="M430 450L200 450L200 305" fill="none" stroke="#2473a6" stroke-width="3" stroke-linejoin="round"/><path d="M200 330L200 305" fill="none" stroke="#2473a6" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="626" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创接口示意；Diffusion Policy 与 π₀ 的输入、骨干及动作表示以各自论文和代码为准。</text></svg>