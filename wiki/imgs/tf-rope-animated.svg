</svg><text x="678" y="332" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">旋转不改变该向量的模长</text><text x="678" y="372" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">原理不是让 Token 在句子里转圈</text><text x="30" y="546" font-size="19" fill="#607789" text-anchor="start" font-weight="400">原创可视化；慢速逐步显示便于学习，不代表真实硬件的执行时序。</text></svg>