<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="π₀：从条件观测到连续动作块"><defs><linearGradient id="head"><stop stop-color="#063c76"/><stop offset="1" stop-color="#087eae"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#397bad" stroke-width="1.5"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="900" fill="#f3f7fc"/><rect x="16" y="16" width="1568" height="112" rx="15" fill="url(#head)"/><text x="45" y="66" font-size="35" fill="white" font-weight="700">π₀：从条件观测到连续动作块</text><text x="46" y="103" font-size="20" fill="#d8efff">主干提供视觉语言条件，动作专家在流场中生成一段可执行动作。</text><rect x="35" y="165" width="485" height="560" rx="14" fill="white" stroke="#087fca" stroke-width="2"/><rect x="36" y="166" width="483" height="54" rx="13" fill="#087fca"/><circle cx="65" cy="193" r="18" fill="white"/><text x="65" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#087fca">1</text><text x="95" y="201" font-size="25" fill="white" font-weight="700">输入与表示</text><text x="55" y="261" font-size="22" fill="#103858">图像 I¹…Iⁿ + 状态 q</text><text x="55" y="300" font-size="22" fill="#103858">语言指令 ℓ</text><text x="55" y="339" font-size="22" fill="#103858">动作块 A∈Rᴴ×ᵈᵃ</text><text x="55" y="378" font-size="22" fill="#103858"></text><rect x="58" y="390" width="420" height="82" rx="10" fill="#eef7ff" stroke="#087fca" stroke-width="2"/><text x="73" y="422" font-size="23" fill="#087fca" font-weight="700">同一接口内归一化</text><text x="75" y="510" font-size="22" fill="#557087" font-weight="400">不同机器人仍需适配器</text><rect x="555" y="165" width="490" height="560" rx="14" fill="white" stroke="#7542c8" stroke-width="2"/><rect x="556" y="166" width="488" height="54" rx="13" fill="#7542c8"/><circle cx="585" cy="193" r="18" fill="white"/><text x="585" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#7542c8">2</text><text x="615" y="201" font-size="25" fill="white" font-weight="700">双专家与注意力</text><text x="575" y="261" font-size="22" fill="#103858">预训练 VLM 主干</text><text x="575" y="300" font-size="22" fill="#103858">动作专家：噪声动作 + τ</text><text x="575" y="339" font-size="22" fill="#103858">动作 token 读取前缀表示</text><text x="575" y="378" font-size="22" fill="#103858"></text><rect x="585" y="390" width="430" height="82" rx="10" fill="#eef7ff" stroke="#7542c8" stroke-width="2"/><text x="600" y="422" font-size="23" fill="#7542c8" font-weight="700">前向信息流：主干 → 专家</text><text x="600" y="510" font-size="22" fill="#557087" font-weight="400">后续知识绝缘会选择性阻断梯度</text><rect x="1070" y="165" width="495" height="560" rx="14" fill="white" stroke="#099773" stroke-width="2"/><rect x="1071" y="166" width="493" height="54" rx="13" fill="#099773"/><circle cx="1100" cy="193" r="18" fill="white"/><text x="1100" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#099773">3</text><text x="1130" y="201" font-size="25" fill="white" font-weight="700">流匹配采样</text><text x="1090" y="261" font-size="22" fill="#103858">噪声 X₀ ~ N(0,I)</text><text x="1090" y="300" font-size="22" fill="#103858">重复：X←X+Δτ·vθ(X,o,ℓ,τ)</text><text x="1090" y="339" font-size="22" fill="#103858">得到 X₁≈动作块 A</text><text x="1090" y="378" font-size="22" fill="#103858"></text><rect x="1100" y="390" width="435" height="82" rx="10" fill="#eef7ff" stroke="#099773" stroke-width="2"/><text x="1115" y="422" font-size="23" fill="#099773" font-weight="700">反归一化 → 控制器 → 执行</text><text x="1118" y="510" font-size="22" fill="#557087" font-weight="400">生成时间与控制时间是两条轴</text><rect x="16" y="807" width="1568" height="77" rx="12" fill="url(#head)"/><text x="42" y="843" font-size="24" fill="white" font-weight="700">核心链路：语义条件 → 连续生成 → 物理接口</text><text x="42" y="871" font-size="17" fill="#d8efff">原创原理示意；数字、坐标和适用条件以正文来源为准。</text></svg>