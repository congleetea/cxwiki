<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="语言记忆：更新事实摘要，而不是不断追加操作日志"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="620" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">语言记忆：更新事实摘要，而不是不断追加操作日志</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">教学任务：清洗盘子；文字为原创例子，不是论文训练样本。</text><rect x="30" y="140" width="345" height="240" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="30" y="140" width="5" height="240" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="48" y="174" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">旧记忆 + 当前证据</text><text x="48" y="212" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">旧记忆：盘子正面已洗净</text><text x="48" y="252" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">当前观测：正在清洗背面</text><text x="48" y="292" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">目标：洗净后放入沥水架</text><rect x="430" y="140" width="345" height="240" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="430" y="140" width="5" height="240" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="448" y="174" font-size="24" fill="#278977" text-anchor="start" font-weight="600">高层作出更新</text><text x="448" y="212" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">成功完成背面清洗？</text><text x="448" y="252" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">若完成：压缩为两面已洗净</text><text x="448" y="292" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">若证据不足：不能臆记完成</text><rect x="830" y="140" width="340" height="240" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="830" y="140" width="5" height="240" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="848" y="174" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">新子任务 + 新记忆</text><text x="848" y="212" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">子任务：把盘子放入沥水架</text><text x="848" y="252" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">记忆：盘子两面已洗净</text><text x="848" y="292" font-size="21" fill="#18364d" text-anchor="start" font-weight="400">下一次高层再读取这份摘要</text><path d="M380 260L420 260" fill="none" stroke="#647f93" stroke-width="3" marker-end="url(#arrow)"/><path d="M780 260L820 260" fill="none" stroke="#647f93" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="445" font-size="24" fill="#18364d" text-anchor="middle" font-weight="400">训练标签：子任务序列 + 成败标记 → 离线 LLM 总结 → 监督高层预测</text><svg x="435.0" y="479.0" width="330.0" height="31.0" viewBox="0 0 330 31" data-latex="$m_{j+1},\ell_{j+1}\sim\pi_{\mathrm{HL}}(\cdot\mid o_{t_j},m_j,g)$"><ns0:metadata xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns2="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
