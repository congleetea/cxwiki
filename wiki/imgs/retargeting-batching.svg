<text x="42" y="64" font-size="34" fill="#fff" font-weight="700" text-anchor="start">离线批处理：并行的是动作片段，不是同一片段的所有帧</text>
<text x="44" y="103" font-size="21" fill="#d8efff" font-weight="400" text-anchor="start">横向依赖保留时间连续性；纵向并行提高总吞吐；两者回答不同的性能问题。</text>
