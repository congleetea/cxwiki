<text x="255" y="536" font-size="23" fill="#099773" font-weight="700" text-anchor="middle">帧 1</text>
<text x="255" y="563" font-size="18" fill="#4f6980" font-weight="400" text-anchor="middle">状态 → IK → 积分</text>
