<text x="40" y="644" font-size="23" fill="#4f6980" font-weight="400" text-anchor="start">每条片段首帧先收敛；后续传递配置与 QP 热启动状态。</text>
<rect x="1073" y="146" width="511" height="522" rx="12" fill="#fff" stroke="#7542c8" stroke-width="2"/>
<rect x="1074" y="147" width="509" height="52" rx="10" fill="#7542c8" stroke="none" stroke-width="2"/>
<circle cx="1101" cy="173" r="18" fill="white"/>
<text x="1101" y="181" font-size="23" fill="#7542c8" font-weight="700" text-anchor="middle">2</text>
<text x="1130" y="181" font-size="25" fill="white" font-weight="700" text-anchor="start">为什么批处理快？</text>
<rect x="1091" y="220" width="475" height="115" rx="12" fill="#f5efff" stroke="#7542c8" stroke-width="2"/>
<text x="1109" y="254" font-size="25" fill="#7542c8" font-weight="700" text-anchor="start">JAX 编译 + 时间 scan</text>
<text x="1109" y="292" font-size="22" fill="#103858" font-weight="400" text-anchor="start">减少 Python 逐帧调度开销</text>
<rect x="1091" y="353" width="475" height="115" rx="12" fill="#f5efff" stroke="#7542c8" stroke-width="2"/>
<text x="1109" y="387" font-size="25" fill="#7542c8" font-weight="700" text-anchor="start">长度分桶 + 编译缓存</text>
<text x="1109" y="425" font-size="22" fill="#103858" font-weight="400" text-anchor="start">补齐长度，复用输入形状</text>
<rect x="1091" y="486" width="475" height="150" rx="12" fill="#f5efff" stroke="#7542c8" stroke-width="2"/>
<text x="1109" y="520" font-size="25" fill="#7542c8" font-weight="700" text-anchor="start">跨设备执行独立片段</text>
<text x="1109" y="558" font-size="22" fill="#103858" font-weight="400" text-anchor="start">总帧数 / 总处理时间 → 批吞吐</text>
<text x="1109" y="592" font-size="22" fill="#103858" font-weight="400" text-anchor="start">它不是在线单帧响应延迟</text>
<rect x="16" y="689" width="1568" height="93" rx="12" fill="#fff5e5" stroke="#e7b45a" stroke-width="2"/>
<text x="40" y="726" font-size="25" fill="#80531a" font-weight="700" text-anchor="start">公平计时：硬件 / 并行数 / 约束 / 精度 / 误差容忍度一致，并报告首次编译与 I/O。</text>
<text x="40" y="763" font-size="23" fill="#80531a" font-weight="400" text-anchor="start">在线看 p50 / p95 单流延迟；离线看吞吐与总耗时。不能直接相除得出统一条件下的加速比。</text>
<rect x="16" y="806" width="1568" height="78" rx="12" fill="url(#header)" stroke="none" stroke-width="2"/>
<text x="40" y="838" font-size="25" fill="#fff" font-weight="700" text-anchor="start">性能比较先对齐问题与计时边界，再比较数字。</text>
<text x="40" y="867" font-size="18" fill="#d8efff" font-weight="400" text-anchor="start">原创原理示意 · 具体约定与适用条件见正文 · cxwiki / 2026-11-05</text>
</svg>