<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="RECAP：从示范、纠正和自主经验提取更好策略"><defs><linearGradient id="head"><stop stop-color="#063c76"/><stop offset="1" stop-color="#087eae"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#397bad" stroke-width="1.5"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1600" height="900" fill="#f3f7fc"/><rect x="16" y="16" width="1568" height="112" rx="15" fill="url(#head)"/><text x="45" y="66" font-size="35" fill="white" font-weight="700">RECAP：从示范、纠正和自主经验提取更好策略</text><text x="46" y="103" font-size="20" fill="#d8efff">价值函数估计进展，优势条件作为策略输入；全流程可迭代。</text><rect x="35" y="165" width="455" height="560" rx="14" fill="white" stroke="#087fca" stroke-width="2"/><rect x="36" y="166" width="453" height="54" rx="13" fill="#087fca"/><circle cx="65" cy="193" r="18" fill="white"/><text x="65" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#087fca">1</text><text x="95" y="201" font-size="25" fill="white" font-weight="700">收集数据</text><text x="55" y="261" font-size="22" fill="#103858">示范数据初始化策略</text><text x="55" y="300" font-size="22" fill="#103858">自主 rollout 产生成败轨迹</text><text x="55" y="339" font-size="22" fill="#103858">机器人犯错时可人工接管纠正</text><text x="55" y="378" font-size="22" fill="#103858">D ← D ∪ 新轨迹</text><text x="55" y="417" font-size="22" fill="#103858"></text><rect x="65" y="510" width="395" height="82" rx="10" fill="#eef7ff" stroke="#087fca" stroke-width="2"/><text x="80" y="542" font-size="23" fill="#087fca" font-weight="700">好与坏样本都保留</text><rect x="570" y="165" width="455" height="560" rx="14" fill="white" stroke="#7542c8" stroke-width="2"/><rect x="571" y="166" width="453" height="54" rx="13" fill="#7542c8"/><circle cx="600" cy="193" r="18" fill="white"/><text x="600" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#7542c8">2</text><text x="630" y="201" font-size="25" fill="white" font-weight="700">训练价值函数</text><text x="590" y="261" font-size="22" fill="#103858">回报：成功终止=0，失败=-C</text><text x="590" y="300" font-size="22" fill="#103858">中间步=-1（论文设置）</text><text x="590" y="339" font-size="22" fill="#103858">Vϕ(o,ℓ) 预测未来回报</text><text x="590" y="378" font-size="22" fill="#103858">优势 A≈动作后价值−当前价值</text><text x="590" y="417" font-size="22" fill="#103858"></text><rect x="600" y="510" width="395" height="82" rx="10" fill="#eef7ff" stroke="#7542c8" stroke-width="2"/><text x="615" y="542" font-size="23" fill="#7542c8" font-weight="700">信用分配：早期错误也有信号</text><rect x="1115" y="165" width="450" height="560" rx="14" fill="white" stroke="#099773" stroke-width="2"/><rect x="1116" y="166" width="448" height="54" rx="13" fill="#099773"/><circle cx="1145" cy="193" r="18" fill="white"/><text x="1145" y="201" text-anchor="middle" font-size="22" font-weight="700" fill="#099773">3</text><text x="1175" y="201" font-size="25" fill="white" font-weight="700">优势条件策略</text><text x="1135" y="261" font-size="22" fill="#103858">I=1[A&gt;εℓ]</text><text x="1135" y="300" font-size="22" fill="#103858">πθ(a|o,ℓ,I) 同时看全部数据</text><text x="1135" y="339" font-size="22" fill="#103858">更新策略后再次 rollout</text><text x="1135" y="378" font-size="22" fill="#103858">任务阈值与数据分布决定改进幅度</text><text x="1135" y="417" font-size="22" fill="#103858"></text><rect x="1145" y="510" width="390" height="82" rx="10" fill="#eef7ff" stroke="#099773" stroke-width="2"/><text x="1160" y="542" font-size="23" fill="#099773" font-weight="700">迭代提升，而非复制失败</text><rect x="16" y="807" width="1568" height="77" rx="12" fill="url(#head)"/><text x="42" y="843" font-size="24" fill="white" font-weight="700">RECAP把流匹配 VLA 的策略提取改造成可扩展的监督条件学习</text><text x="42" y="871" font-size="17" fill="#d8efff">原创原理示意；数字、坐标和适用条件以正文来源为准。</text></svg>