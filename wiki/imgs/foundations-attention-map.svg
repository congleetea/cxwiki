<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-label="注意力变体：五个可以交叉组合的维度"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#647f93"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1200" height="610" rx="18" fill="#f4f7fb"/><rect width="1200" height="95" rx="18" fill="#153d5c"/><rect y="75" width="1200" height="20" fill="#153d5c"/><text x="30" y="40" font-size="29" fill="white" text-anchor="start" font-weight="600">注意力变体：五个可以交叉组合的维度</text><text x="30" y="76" font-size="19" fill="#d1e4f1" text-anchor="start" font-weight="400">同一个层可以同时是“多头、自注意力、因果、局部或稀疏”。</text><rect x="35" y="125" width="265" height="64" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="35" y="125" width="5" height="64" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="53" y="159" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">信息来源</text><path d="M307 158L350 158" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="125" width="800" height="64" rx="12" fill="white" stroke="#d6e1ea" stroke-width="2"/><text x="390" y="166" font-size="24" fill="#18364d" text-anchor="start" font-weight="400">自注意力 / 交叉注意力</text><rect x="35" y="203" width="265" height="64" rx="12" fill="white" stroke="#8061bb" stroke-width="2"/><rect x="35" y="203" width="5" height="64" rx="0" fill="#8061bb" stroke="#8061bb" stroke-width="2"/><text x="53" y="237" font-size="24" fill="#8061bb" text-anchor="start" font-weight="600">可见范围</text><path d="M307 236L350 236" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="203" width="800" height="64" rx="12" fill="white" stroke="#d6e1ea" stroke-width="2"/><text x="390" y="244" font-size="24" fill="#18364d" text-anchor="start" font-weight="400">全局 / 局部 / 块</text><rect x="35" y="281" width="265" height="64" rx="12" fill="white" stroke="#278977" stroke-width="2"/><rect x="35" y="281" width="5" height="64" rx="0" fill="#278977" stroke="#278977" stroke-width="2"/><text x="53" y="315" font-size="24" fill="#278977" text-anchor="start" font-weight="600">连接密度</text><path d="M307 314L350 314" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="281" width="800" height="64" rx="12" fill="white" stroke="#d6e1ea" stroke-width="2"/><text x="390" y="322" font-size="24" fill="#18364d" text-anchor="start" font-weight="400">稠密 / 稀疏</text><rect x="35" y="359" width="265" height="64" rx="12" fill="white" stroke="#cf7446" stroke-width="2"/><rect x="35" y="359" width="5" height="64" rx="0" fill="#cf7446" stroke="#cf7446" stroke-width="2"/><text x="53" y="393" font-size="24" fill="#cf7446" text-anchor="start" font-weight="600">头的组织</text><path d="M307 392L350 392" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="359" width="800" height="64" rx="12" fill="white" stroke="#d6e1ea" stroke-width="2"/><text x="390" y="400" font-size="24" fill="#18364d" text-anchor="start" font-weight="400">单头 / 多头</text><rect x="35" y="437" width="265" height="64" rx="12" fill="white" stroke="#2473a6" stroke-width="2"/><rect x="35" y="437" width="5" height="64" rx="0" fill="#2473a6" stroke="#2473a6" stroke-width="2"/><text x="53" y="471" font-size="24" fill="#2473a6" text-anchor="start" font-weight="600">计算与掩码</text><path d="M307 470L350 470" fill="none" stroke="#647f93" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="437" width="800" height="64" rx="12" fill="white" stroke="#d6e1ea" stroke-width="2"/><text x="390" y="478" font-size="24" fill="#18364d" text-anchor="start" font-weight="400">因果 / 双向 / 滑窗 / 线性</text><text x="30" y="586" font-size="19" fill="#607789" text-anchor="start" font-weight="400">这些分类并非互斥；线性注意力改变计算形式，FlashAttention 优化精确注意力的 IO。</text></svg>