# Installed on tx as /etc/nginx/sites-available/cxwiki.
server {
    listen 80;
    server_name 43.138.240.151;
    return 301 https://43.138.240.151$request_uri;
}

server {
    listen 443 ssl;
    server_name 43.138.240.151;
    ssl_certificate /etc/nginx/ssl/cxwiki.crt;
    ssl_certificate_key /etc/nginx/ssl/cxwiki.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "cxwiki";
    auth_basic_user_file /etc/nginx/cxwiki.htpasswd;
    root /var/www/cxwiki/current;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Revalidate mutable pages and the rank file on subsequent visits.
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }

    # The local editing API must not accept public writes.
    location /__cxwiki/ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
